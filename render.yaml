# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: devinventor-voice
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /var/data/db.json
      - key: ADMIN_TOKEN
        generateValue: true
      - key: INBOUND_SECRET
        generateValue: true
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: TELEPHONY_PROVIDER
        value: plivo
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: CLAUDE_EFFORT
        value: low
      - key: ELEVENLABS_TTS_MODEL
        value: eleven_flash_v2_5
      - key: PUBLIC_URL
        sync: false
      - key: CALLER_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: PLIVO_AUTH_ID
        sync: false
      - key: PLIVO_AUTH_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: OUTCOME_WEBHOOK_URL
        sync: false
