<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>The Extra Seat - Part 3 (renderer)</title>
<style>
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:NotoTe;font-weight:900;src:url(fonts/noto-sans-telugu-telugu-900-normal.woff2);unicode-range:U+0C00-0C7F,U+200C-200D,U+25CC}
@font-face{font-family:NotoTe;font-weight:900;src:url(fonts/noto-sans-telugu-latin-900-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Rama;src:url(fonts/ramabhadra-telugu-400-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
// ======================================================================
//  The Extra Seat - Part 3 : procedural 2D cartoon renderer
//  renderFrame(t) draws the frame at time t (seconds). TL = timeline.json
// ======================================================================
const W = 1080, H = 1920;
const cv = document.getElementById('cv'), X = cv.getContext('2d');
const bufA = document.createElement('canvas'), bufB = document.createElement('canvas');
bufA.width = bufB.width = W; bufA.height = bufB.height = H;
let TL = null;
const INK = '#2a1a12';

// ---------- maths ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const seg = (t, a, b) => clamp((t - a) / (b - a));

// ---------- timeline helpers ----------
const L = id => TL.lines.find(l => l.id === id);
function mouthAt(t, who) {
  const f = Math.round(t * TL.fps);
  if (TL.speaker[f] !== who) return 0;
  const v = TL.mouth[f] || 0;
  return clamp(v * 1.15);
}

// ---------- drawing helpers ----------
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function fillStroke(c, fill, lw = 6, stroke = INK) { c.fillStyle = fill; c.fill(); if (lw) { c.lineWidth = lw; c.strokeStyle = stroke; c.lineJoin = 'round'; c.stroke(); } }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, Math.PI * 2); }
function vgrad(c, y0, y1, stops) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach((s, i) => g.addColorStop(s[0], s[1])); return g; }
function shade(c, path, color, alpha) { c.save(); path(); c.clip(); c.globalAlpha = alpha; c.fillStyle = color; c.fillRect(-5000, -5000, 10000, 10000); c.restore(); }

// ---------- environment ----------
function rain(c, t, n, alpha, ang = 0.18, len = 60, speed = 1900, seed = 0) {
  c.save(); c.strokeStyle = `rgba(210,225,255,${alpha})`; c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const h1 = hash(i + seed), h2 = hash(i * 3.7 + seed), h3 = hash(i * 7.3 + seed);
    const sp = speed * (0.7 + h3 * 0.6);
    const y = ((h2 * (H + 300) + t * sp) % (H + 300)) - 150;
    const x = ((h1 * (W + 400) + y * ang) % (W + 400)) - 200;
    c.lineWidth = 1.5 + h3 * 2.5;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x - ang * len * (0.6 + h3), y - len * (0.6 + h3)); c.stroke();
  }
  c.restore();
}
function windowRain(c, x, y, w, h, t, seed, a = 0.5) {
  c.save(); rr(c, x, y, w, h, 10); c.clip();
  for (let i = 0; i < 9; i++) {
    const hx = hash(i + seed), hs = hash(i * 5.1 + seed);
    const yy = y + ((hs * h + t * (40 + hs * 90)) % (h + 40)) - 20;
    const xx = x + hx * w;
    c.strokeStyle = `rgba(230,240,255,${a})`; c.lineWidth = 3;
    c.beginPath(); c.moveTo(xx, yy - 40 - hs * 50); c.lineTo(xx + 2, yy); c.stroke();
    ell(c, xx + 2, yy + 3, 5, 6); c.fillStyle = `rgba(240,248,255,${a + 0.2})`; c.fill();
  }
  c.restore();
}
function palm(c, x, y, s, col = '#1d2a2a') {
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = col; c.strokeStyle = col;
  c.lineWidth = 16; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(18, -140, 6, -300); c.stroke();
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.45;
    c.beginPath(); c.moveTo(6, -300);
    c.quadraticCurveTo(6 + Math.cos(a) * 90, -300 + Math.sin(a) * 90 - 30, 6 + Math.cos(a) * 170, -300 + Math.sin(a) * 140 + 60);
    c.lineWidth = 12; c.stroke();
  }
  c.restore();
}
function house(c, x, y, w, h, wall, roof, lit) {
  c.fillStyle = wall; c.fillRect(x, y - h, w, h);
  c.beginPath(); c.moveTo(x - 20, y - h); c.lineTo(x + w / 2, y - h - h * 0.55); c.lineTo(x + w + 20, y - h); c.closePath(); c.fillStyle = roof; c.fill();
  c.fillStyle = lit ? '#ffcf6b' : '#1a1a24'; c.fillRect(x + w * 0.2, y - h * 0.65, w * 0.22, h * 0.3);
  c.fillStyle = '#1a1310'; c.fillRect(x + w * 0.58, y - h * 0.55, w * 0.22, h * 0.55);
  if (lit) { const g = c.createRadialGradient(x + w * 0.31, y - h * 0.5, 0, x + w * 0.31, y - h * 0.5, 90); g.addColorStop(0, 'rgba(255,200,90,0.35)'); g.addColorStop(1, 'rgba(255,200,90,0)'); c.fillStyle = g; c.fillRect(x - 80, y - h - 80, w + 160, h + 160); }
}
function gopuram(c, x, y, s, col) {
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = col;
  for (let i = 0; i < 6; i++) { const w = 160 - i * 22; c.fillRect(-w / 2, -i * 40 - 40, w, 42); }
  c.beginPath(); c.moveTo(-30, -280); c.quadraticCurveTo(0, -330, 30, -280); c.fill();
  c.restore();
}

// ---------- the bus ----------
function busSide(c, x, y, s, t, o = {}) {
  // x,y = bottom-left of body at road level, faces right
  c.save(); c.translate(x, y); c.scale(s, s);
  const Lb = 900, Hb = 330;
  // shadow
  ell(c, Lb / 2, 8, Lb * 0.55, 22); c.fillStyle = 'rgba(0,0,0,0.35)'; c.fill();
  // body
  rr(c, 0, -Hb - 40, Lb, Hb, 38); fillStroke(c, '#f2e2bd', 8);
  c.save(); rr(c, 0, -Hb - 40, Lb, Hb, 38); c.clip();
  c.fillStyle = '#c7302c'; c.fillRect(0, -150, Lb, 120);
  c.fillStyle = '#e8b13a'; c.fillRect(0, -160, Lb, 14);
  c.fillStyle = 'rgba(0,0,0,0.12)'; c.fillRect(0, -70, Lb, 40);
  c.restore();
  // roof rack
  rr(c, 60, -Hb - 62, Lb - 160, 24, 8); fillStroke(c, '#7a5b3a', 5);
  // windows
  for (let i = 0; i < 6; i++) {
    const wx = 70 + i * 118; rr(c, wx, -Hb - 10, 96, 120, 12);
    fillStroke(c, o.warm ? '#ffd58a' : '#3b5a7a', 6);
    // passenger silhouettes
    if (!o.empty) { c.save(); rr(c, wx, -Hb - 10, 96, 120, 12); c.clip(); c.fillStyle = o.warm ? 'rgba(120,70,30,0.6)' : 'rgba(15,25,40,0.65)'; ell(c, wx + 48, -Hb + 70, 26, 30); c.fill(); c.fillRect(wx + 14, -Hb + 95, 68, 40); c.restore(); }
    c.fillStyle = 'rgba(255,255,255,0.25)'; c.beginPath(); c.moveTo(wx + 10, -Hb + 100); c.lineTo(wx + 40, -Hb - 2); c.lineTo(wx + 55, -Hb - 2); c.lineTo(wx + 25, -Hb + 100); c.fill();
  }
  // door + windscreen
  rr(c, 780, -Hb - 10, 80, 250, 10); fillStroke(c, o.warm ? '#ffd58a' : '#2f4a66', 6);
  rr(c, 862, -Hb - 14, 36, 150, 12); fillStroke(c, '#5d86ad', 5);
  // destination board
  rr(c, 300, -Hb - 34, 300, 26, 6); fillStroke(c, '#151515', 4);
  c.fillStyle = '#ffb02e'; c.font = '900 20px NotoTe'; c.textAlign = 'center'; c.fillText('6:00 PM  •  రామాపురం', 450, -Hb - 14);
  // headlight
  ell(c, 888, -70, 14, 18); fillStroke(c, '#fff3b0', 4);
  if (o.lights) { const g = c.createRadialGradient(900, -70, 0, 900, -70, 300); g.addColorStop(0, 'rgba(255,240,170,0.55)'); g.addColorStop(1, 'rgba(255,240,170,0)'); c.fillStyle = g; c.beginPath(); c.moveTo(895, -80); c.lineTo(1300, -170); c.lineTo(1300, 60); c.closePath(); c.fill(); }
  // wheels
  for (const wx of [170, 700]) {
    ell(c, wx, -20, 64, 64); fillStroke(c, '#1b1b1b', 6);
    ell(c, wx, -20, 30, 30); fillStroke(c, '#9a9a9a', 4);
    const a = (o.wheel || 0);
    c.strokeStyle = '#444'; c.lineWidth = 6;
    for (let k = 0; k < 3; k++) { const aa = a + k * 2.094; c.beginPath(); c.moveTo(wx, -20); c.lineTo(wx + Math.cos(aa) * 28, -20 + Math.sin(aa) * 28); c.stroke(); }
  }
  c.restore();
}
function busRear(c, x, y, s, warm) {
  c.save(); c.translate(x, y); c.scale(s, s);
  ell(c, 0, 6, 230, 22); c.fillStyle = 'rgba(0,0,0,0.3)'; c.fill();
  rr(c, -200, -420, 400, 400, 36); fillStroke(c, '#f2e2bd', 8);
  c.save(); rr(c, -200, -420, 400, 400, 36); c.clip(); c.fillStyle = '#c7302c'; c.fillRect(-200, -150, 400, 130); c.fillStyle = '#e8b13a'; c.fillRect(-200, -160, 400, 12); c.restore();
  rr(c, -160, -380, 320, 170, 16); fillStroke(c, warm ? '#ffcf7a' : '#3b5a7a', 6);
  // the family in the rear window: son, grandfather, little girl
  c.save(); rr(c, -160, -380, 320, 170, 16); c.clip(); c.fillStyle = 'rgba(70,35,15,0.85)';
  ell(c, -70, -270, 34, 40); c.fill(); c.fillRect(-120, -235, 100, 60);
  ell(c, 60, -265, 32, 38); c.fill(); c.fillRect(12, -232, 96, 60);
  ell(c, -2, -238, 22, 25); c.fill(); c.fillRect(-28, -216, 52, 40);
  c.restore();
  for (const sx of [-150, 150]) { rr(c, sx - 26, -110, 52, 30, 8); fillStroke(c, '#ff4a3a', 4); }
  ell(c, -130, -10, 46, 30); c.fillStyle = '#151515'; c.fill(); ell(c, 130, -10, 46, 30); c.fill();
  c.restore();
}

// ---------- characters ----------
const CH = {
  thatha: { skin: '#c4875a', skinD: '#9e6540', shirt: '#b49a62', shirtD: '#8f7746', hair: '#f1f1ee' },
  srinu:  { skin: '#b5774b', skinD: '#8d5532', shirt: '#3e6db3', shirtD: '#2b4f85', hair: '#17110e' },
  paapa:  { skin: '#c88958', skinD: '#a0663c', shirt: '#f2c230', shirtD: '#cf9b17', hair: '#1a120e' },
};
function eye(c, x, y, r, o) {
  const blink = o.blink;
  if (o.eyes === 'closed' || blink) {
    c.strokeStyle = INK; c.lineWidth = r * 0.35; c.lineCap = 'round';
    c.beginPath(); c.arc(x, y - (o.eyes === 'happy' ? r * 0.3 : 0), r * 0.9, 0.15 * Math.PI, 0.85 * Math.PI, o.eyes === 'happy'); c.stroke(); return;
  }
  if (o.eyes === 'happy') { c.strokeStyle = INK; c.lineWidth = r * 0.38; c.lineCap = 'round'; c.beginPath(); c.arc(x, y + r * 0.35, r * 0.85, 1.15 * Math.PI, 1.85 * Math.PI); c.stroke(); return; }
  const wide = o.eyes === 'wide' ? 1.25 : 1;
  ell(c, x, y, r * 0.95 * wide, r * 1.15 * wide); fillStroke(c, '#fff', r * 0.22);
  const px = x + (o.look || 0) * r * 0.35, py = y + r * 0.15;
  ell(c, px, py, r * 0.55, r * 0.62); c.fillStyle = '#3a2416'; c.fill();
  ell(c, px, py, r * 0.3, r * 0.34); c.fillStyle = '#0d0806'; c.fill();
  ell(c, px - r * 0.2, py - r * 0.25, r * 0.17, r * 0.17); c.fillStyle = '#fff'; c.fill();
  if (o.wet) { ell(c, px, py + r * 0.65, r * 0.6, r * 0.18); c.fillStyle = 'rgba(160,210,255,0.7)'; c.fill(); }
  if (o.eyes === 'sad') { // heavy upper lid
    c.save(); ell(c, x, y, r * 0.95, r * 1.15); c.clip(); c.fillStyle = o.lid; c.fillRect(x - r * 1.2, y - r * 1.4, r * 2.4, r * 0.95); c.restore();
    c.strokeStyle = INK; c.lineWidth = r * 0.22; c.beginPath(); c.moveTo(x - r, y - r * 0.45); c.lineTo(x + r, y - r * 0.45); c.stroke();
  }
}
function tearDrop(c, x, y, r, k) {
  if (k <= 0) return;
  const yy = y + k * r * 3.2;
  c.save(); c.globalAlpha = clamp(k * 3) * clamp((1.15 - k) * 4);
  c.beginPath(); c.moveTo(x, yy - r * 0.9); c.quadraticCurveTo(x + r * 0.6, yy, x, yy + r * 0.45); c.quadraticCurveTo(x - r * 0.6, yy, x, yy - r * 0.9);
  c.fillStyle = '#9fd6ff'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = '#4a8ac2'; c.stroke();
  c.strokeStyle = 'rgba(160,215,255,0.6)'; c.lineWidth = r * 0.25; c.beginPath(); c.moveTo(x, y); c.lineTo(x, yy - r); c.stroke();
  c.restore();
}
// generic head+bust. (x,y) = head centre, R = head radius
function person(c, kind, x, y, R, o = {}) {
  const p = CH[kind] || o.pal;
  const lw = Math.max(3, R * 0.07);
  c.save(); c.translate(x, y);
  // ---- bust ----
  if (o.bust !== false) {
    const sw = kind === 'paapa' ? R * 1.25 : R * 1.75;
    const path = () => { c.beginPath(); c.moveTo(-R * 0.35, R * 0.75); c.quadraticCurveTo(-sw, R * 1.0, -sw, R * 2.2); c.lineTo(-sw * 1.05, R * 4.2); c.lineTo(sw * 1.05, R * 4.2); c.lineTo(sw, R * 2.2); c.quadraticCurveTo(sw, R * 1.0, R * 0.35, R * 0.75); c.closePath(); };
    path(); fillStroke(c, o.wetShirt ? p.shirtD : p.shirt, lw);
    shade(c, path, p.shirtD, 0.55 * (o.lightSide ?? 1) * 0.6);
    c.save(); path(); c.clip(); c.fillStyle = p.shirtD; c.globalAlpha = 0.6; c.fillRect(0, R * 0.7, sw * 1.2, R * 4); c.restore();
    // collar
    c.beginPath(); c.moveTo(-R * 0.45, R * 0.72); c.lineTo(0, R * 1.35); c.lineTo(R * 0.45, R * 0.72); fillStroke(c, kind === 'paapa' ? '#fff3c4' : p.shirt, lw * 0.8);
    if (kind === 'thatha') { // bag strap + badge + pocket pen
      c.strokeStyle = '#5b3a22'; c.lineWidth = R * 0.28; c.beginPath(); c.moveTo(-sw * 0.85, R * 1.1); c.lineTo(sw * 0.7, R * 4.1); c.stroke();
      rr(c, R * 0.55, R * 1.6, R * 0.5, R * 0.32, 4); fillStroke(c, '#d9d2c0', lw * 0.6);
      c.fillStyle = '#c7302c'; c.fillRect(-R * 0.95, R * 1.5, R * 0.08, R * 0.5);
    }
    if (kind === 'srinu') { c.strokeStyle = '#2b2b2b'; c.lineWidth = R * 0.25; c.beginPath(); c.moveTo(-sw * 0.6, R * 1.0); c.lineTo(-sw * 0.75, R * 4.1); c.stroke(); c.beginPath(); c.moveTo(sw * 0.6, R * 1.0); c.lineTo(sw * 0.75, R * 4.1); c.stroke(); }
    if (o.wetShirt) { for (let i = 0; i < 6; i++) { ell(c, (hash(i + 3) - 0.5) * sw * 1.6, R * (1.4 + hash(i) * 2.4), R * 0.08, R * 0.12); c.fillStyle = 'rgba(180,220,255,0.6)'; c.fill(); } }
    // neck
    rr(c, -R * 0.3, R * 0.45, R * 0.6, R * 0.5, R * 0.2); fillStroke(c, p.skinD, lw * 0.8);
  }
  // ---- head ----
  c.rotate(o.tilt || 0);
  const hx = 0;
  if (kind === 'paapa') { // pigtails behind head
    for (const s of [-1, 1]) { ell(c, s * R * 1.05, R * 0.15, R * 0.32, R * 0.5, s * 0.4); fillStroke(c, p.hair, lw); ell(c, s * R * 0.88, -R * 0.2, R * 0.18, R * 0.14); fillStroke(c, '#e2363b', lw * 0.7); }
  }
  // ears
  for (const s of [-1, 1]) { ell(c, s * R * 0.98, R * 0.08, R * 0.2, R * 0.27); fillStroke(c, p.skin, lw); }
  ell(c, hx, 0, R, R * (kind === 'paapa' ? 1.0 : 1.08)); fillStroke(c, p.skin, lw);
  shade(c, () => ell(c, hx, 0, R, R * 1.08), p.skinD, 0.35);
  c.save(); ell(c, hx, 0, R, R * 1.08); c.clip(); ell(c, hx - R * 0.25, -R * 0.15, R * 0.95, R * 1.05); c.fillStyle = p.skin; c.fill(); c.restore();
  // hair
  if (kind === 'thatha') {
    for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * R * 0.9, -R * 0.32, R * 0.17, R * 0.26, s * 0.25, 0, Math.PI * 2); fillStroke(c, '#e4e4de', lw * 0.7); }
    c.strokeStyle = 'rgba(90,50,30,0.45)'; c.lineWidth = lw * 0.6; c.beginPath(); c.moveTo(-R * 0.35, -R * 0.62); c.quadraticCurveTo(0, -R * 0.7, R * 0.35, -R * 0.62); c.stroke(); c.beginPath(); c.moveTo(-R * 0.28, -R * 0.5); c.quadraticCurveTo(0, -R * 0.57, R * 0.28, -R * 0.5); c.stroke();
    ell(c, -R * 0.3, -R * 0.75, R * 0.25, R * 0.1, -0.3); c.fillStyle = 'rgba(255,255,255,0.35)'; c.fill();
  } else {
    c.beginPath(); c.moveTo(-R * 1.02, R * 0.05);
    c.bezierCurveTo(-R * 1.15, -R * 1.25, R * 1.15, -R * 1.35, R * 1.02, R * 0.0);
    if (kind === 'paapa') { c.quadraticCurveTo(R * 0.7, -R * 0.55, 0, -R * 0.62); c.quadraticCurveTo(-R * 0.7, -R * 0.55, -R * 1.02, R * 0.05); }
    else { c.quadraticCurveTo(R * 0.85, -R * 0.45, R * 0.4, -R * 0.55); c.quadraticCurveTo(R * 0.1, -R * 0.35, -R * 0.2, -R * 0.62); c.quadraticCurveTo(-R * 0.75, -R * 0.45, -R * 1.02, R * 0.05); }
    fillStroke(c, p.hair, lw);
    ell(c, R * 0.25, -R * 0.82, R * 0.35, R * 0.1, 0.2); c.fillStyle = 'rgba(255,255,255,0.18)'; c.fill();
    if (o.wet) { c.strokeStyle = p.hair; c.lineWidth = lw * 1.4; c.lineCap = 'round'; for (const s of [-0.35, 0.05, 0.4]) { c.beginPath(); c.moveTo(R * s, -R * 0.5); c.quadraticCurveTo(R * (s + 0.08), -R * 0.25, R * (s - 0.05), -R * 0.12); c.stroke(); } }
  }
  // brows
  const er = R * (kind === 'paapa' ? 0.24 : 0.2);
  const ey = -R * 0.02, ex = R * 0.38;
  const sad = o.eyes === 'sad' || o.brow === 'sad';
  c.strokeStyle = kind === 'thatha' ? '#e8e8e2' : INK; c.lineWidth = R * (kind === 'thatha' ? 0.13 : 0.1); c.lineCap = 'round';
  for (const s of [-1, 1]) {
    const inner = sad ? -R * 0.42 : (o.eyes === 'wide' ? -R * 0.5 : -R * 0.33);
    const outer = sad ? -R * 0.3 : (o.eyes === 'wide' ? -R * 0.48 : -R * 0.36);
    c.beginPath(); c.moveTo(s * R * 0.16, inner); c.lineTo(s * R * 0.6, outer); c.stroke();
  }
  const eo = { ...o, lid: p.skin };
  eye(c, -ex, ey, er, eo); eye(c, ex, ey, er, eo);
  if (kind === 'thatha') { // round glasses
    c.strokeStyle = '#3a3a3a'; c.lineWidth = R * 0.05;
    for (const s of [-1, 1]) { ell(c, s * ex, ey + R * 0.02, R * 0.29, R * 0.27); c.stroke(); }
    c.beginPath(); c.moveTo(-ex + R * 0.29, ey); c.lineTo(ex - R * 0.29, ey); c.stroke();
    c.strokeStyle = 'rgba(90,50,30,0.35)'; c.lineWidth = lw * 0.5; for (const s of [-1, 1]) { c.beginPath(); c.arc(s * R * 0.72, R * 0.05, R * 0.12, -0.6, 0.9); c.stroke(); }
  }
  // nose
  c.strokeStyle = p.skinD; c.lineWidth = lw * 0.9; c.beginPath(); c.moveTo(R * 0.03, R * 0.12); c.quadraticCurveTo(R * 0.16, R * 0.34, R * -0.02, R * 0.38); c.stroke();
  // cheeks
  ell(c, -R * 0.55, R * 0.38, R * 0.16, R * 0.09); c.fillStyle = 'rgba(230,90,80,0.28)'; c.fill();
  ell(c, R * 0.55, R * 0.38, R * 0.16, R * 0.09); c.fill();

function interior(c, t, o = {}) {
  const warm = o.warm || 0, vpX = 540, vpY = 760;
  // walls / ceiling / floor
  c.fillStyle = vgrad(c, 0, H, [[0, lerp(0, 1, warm) > 0.5 ? '#5a4030' : '#2d3442'], [1, '#141820']]); c.fillRect(0, 0, W, H);
  const cool = ['#3a4458', '#2a3140', '#46516a'], wrm = ['#8a6440', '#6a4a30', '#a37a50'];
  const col = i => warm > 0.5 ? wrm[i] : cool[i];
  // ceiling
  c.beginPath(); c.moveTo(0, 0); c.lineTo(W, 0); c.lineTo(vpX + 200, vpY - 230); c.lineTo(vpX - 200, vpY - 230); c.closePath(); c.fillStyle = col(2); c.fill();
  // floor
  c.beginPath(); c.moveTo(0, H); c.lineTo(W, H); c.lineTo(vpX + 200, vpY + 150); c.lineTo(vpX - 200, vpY + 150); c.closePath(); c.fillStyle = col(1); c.fill();
  c.beginPath(); c.moveTo(360, H); c.lineTo(720, H); c.lineTo(vpX + 50, vpY + 150); c.lineTo(vpX - 50, vpY + 150); c.closePath(); c.fillStyle = 'rgba(0,0,0,0.25)'; c.fill();
  // back wall + rear window
  c.fillStyle = col(0); c.fillRect(vpX - 200, vpY - 230, 400, 380);
  rr(c, vpX - 150, vpY - 200, 300, 150, 14); fillStroke(c, warm > 0.5 ? '#ffd27a' : '#53708f', 5);
  // side walls with windows
  for (const sd of [-1, 1]) {
    c.beginPath(); c.moveTo(sd < 0 ? 0 : W, 0); c.lineTo(vpX + sd * 200, vpY - 230); c.lineTo(vpX + sd * 200, vpY + 150); c.lineTo(sd < 0 ? 0 : W, H); c.closePath(); c.fillStyle = col(0); c.fill();
    for (let i = 0; i < 4; i++) {
      const z0 = i / 4, z1 = (i + 0.78) / 4;
      const px = z => lerp(sd < 0 ? 0 : W, vpX + sd * 200, Math.pow(z, 0.7));
      const pyT = z => lerp(150, vpY - 200, Math.pow(z, 0.7)), pyB = z => lerp(900, vpY + 10, Math.pow(z, 0.7));
      c.beginPath(); c.moveTo(px(z0), pyT(z0)); c.lineTo(px(z1), pyT(z1)); c.lineTo(px(z1), pyB(z1)); c.lineTo(px(z0), pyB(z0)); c.closePath();
      const g = c.createLinearGradient(0, pyT(z0), 0, pyB(z0));
      if (warm > 0.5) { g.addColorStop(0, '#ffb35a'); g.addColorStop(1, '#ffe2a0'); } else { g.addColorStop(0, '#4c6d90'); g.addColorStop(1, '#6f8fae'); }
      fillStroke(c, g, 6);
      if (!warm) { c.save(); c.clip(); for (let k = 0; k < 6; k++) { const xx = lerp(px(z0), px(z1), hash(k + i * 9 + (sd + 2) * 50)); const yy = lerp(pyT(z0), pyB(z0), (hash(k * 3 + i) + t * (0.15 + hash(k) * 0.2)) % 1); c.strokeStyle = 'rgba(220,235,255,0.55)'; c.lineWidth = 3; c.beginPath(); c.moveTo(xx, yy - 40); c.lineTo(xx, yy); c.stroke(); } c.restore(); }
    }
  }
  // light from windows
  if (warm > 0) { c.save(); c.globalAlpha = 0.25 * warm; c.fillStyle = '#ffd38a'; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(W, 150 + k * 190); c.lineTo(W, 300 + k * 190); c.lineTo(300 + k * 60, 1500 + k * 80); c.lineTo(200 + k * 60, 1400 + k * 80); c.closePath(); c.fill(); } c.restore(); }
  // handrail
  c.strokeStyle = '#bfc4c8'; c.lineWidth = 10; for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(vpX + sd * 160, vpY - 200); c.lineTo(vpX + sd * 380, 80); c.stroke(); }
  // seats rows (far -> near)
  const rows = [
    { z: 0.88, s: 0.32 }, { z: 0.74, s: 0.42 }, { z: 0.56, s: 0.58 }, { z: 0.3, s: 0.85 },
  ];
  const pal = [
    { skin: '#b97c50', skinD: '#8e5734', shirt: '#7a3b6e', shirtD: '#5a2850', hair: '#1a1210' },
    { skin: '#c99063', skinD: '#9c6a44', shirt: '#2f8a6a', shirtD: '#1f634b', hair: '#241812' },
    { skin: '#a96e45', skinD: '#7f4f2e', shirt: '#d06a2c', shirtD: '#9c4b1c', hair: '#151010' },
    { skin: '#c78a5c', skinD: '#9b6440', shirt: '#4a59a8', shirtD: '#35407b', hair: '#d9d9d9' },
  ];
  rows.forEach((r, ri) => {
    for (const sd of [-1, 1]) {
      const sx = lerp(sd < 0 ? 170 : 910, vpX + sd * 120, r.z), sy = lerp(1580, vpY + 120, r.z), s = r.s;
      const isEmpty = (ri === 3 && sd === 1);

      if (isEmpty) {

      } else if (!(o.hideNear && ri === 3)) {

        person(c, null, sx, sy - seatH * 0.62 + bob, 70 * s, { pal: pal[k], eyes: o.happy ? 'happy' : (hash(ri * 7 + sd) > 0.5 ? 'closed' : 'open'), smile: o.happy ? 1 : 0.2, look: -sd * 0.6, blink: ((t * 0.4 + hash(ri + sd)) % 1) < 0.04 });
        if (o.clap) { const cl = Math.abs(Math.sin(t * 11 + ri)); c.fillStyle = pal[k].skin; for (const hs of [-1, 1]) { ell(c, sx + hs * (18 + cl * 22) * s, sy - seatH * 0.05, 22 * s, 30 * s); fillStroke(c, pal[k].skin, 4 * s); } }

}

// S6: rear door view, runner coming through the rain

SC.push({ id: 'talk', draw(c, lt, t) {

// S9: chalk wiped, the granddaughter takes the extra seat
SC.push({ id: 'sit', draw(c, lt, t) {
  const sitK = easeOut(seg(lt, 1.8, 2.8));
  const z = 1.85 - 0.5 * ease(seg(lt, 2.5, 5.0));
  c.save(); c.translate(760, 1180); c.scale(z, z); c.translate(-760, -1180);
  interior(c, t, {
    warm: 1, glow: 1, chalk: 1 - seg(lt, 0.4, 1.7), happy: lt > 2.4, clap: lt > 2.8,
    inSeat: (cc, sx, sy, s) => {
      if (sitK > 0) person(cc, 'paapa', sx, sy - 420 * s * 0.5 + (1 - sitK) * 300 * s, 72 * s, { eyes: lt > 3 ? 'happy' : 'open', smile: 1, look: -0.3 });

        cc.beginPath(); cc.moveTo(30 * s, 20 * s); cc.lineTo(400 * s, 500 * s); cc.lineTo(300 * s, 560 * s); cc.lineTo(-20 * s, 30 * s); cc.closePath(); fillStroke(cc, CH.thatha.skin, 5 * s); cc.restore();

// S10: sunset after the rain, bus drives away, end card
SC.push({ id: 'sunset', draw(c, lt, t) {
  sky(c, '#3b3a78', '#e0717a', '#ffc36e', 1050);
  const sg = c.createRadialGradient(540, 1020, 0, 540, 1020, 500); sg.addColorStop(0, 'rgba(255,240,180,0.95)'); sg.addColorStop(0.2, 'rgba(255,200,120,0.6)'); sg.addColorStop(1, 'rgba(255,160,100,0)'); c.fillStyle = sg; c.fillRect(0, 0, W, H);
  // rainbow
  c.save(); c.globalAlpha = 0.35 * seg(lt, 0, 1.5); const rc = ['#ff5a5a', '#ffa64d', '#ffe066', '#7ed957', '#4dc3ff', '#7a6cff']; rc.forEach((col, i) => { c.strokeStyle = col; c.lineWidth = 22; c.beginPath(); c.arc(540, 1100, 760 - i * 22, Math.PI, 2 * Math.PI); c.stroke(); }); c.restore();
  c.fillStyle = '#5a3a5e'; c.beginPath(); c.moveTo(0, 1050); for (let x = 0; x <= W; x += 60) c.lineTo(x, 1030 - Math.sin(x * 0.006 + 2) * 50); c.lineTo(W, 1200); c.lineTo(0, 1200); c.fill();
  gopuram(c, 170, 1060, 0.6, '#3e2848');
  c.fillStyle = '#3a2a3e'; c.fillRect(0, 1050, W, 900);
  // wet road with sun reflection
  c.beginPath(); c.moveTo(60, H); c.lineTo(1020, H); c.lineTo(560, 1055); c.lineTo(520, 1055); c.closePath(); c.fillStyle = '#4a3a4e'; c.fill();
  c.save(); c.beginPath(); c.moveTo(60, H); c.lineTo(1020, H); c.lineTo(560, 1055); c.lineTo(520, 1055); c.closePath(); c.clip(); const rg = c.createLinearGradient(0, 1055, 0, H); rg.addColorStop(0, 'rgba(255,220,150,0.8)'); rg.addColorStop(1, 'rgba(255,150,100,0.1)'); c.fillStyle = rg; c.fillRect(440, 1055, 200, 900); c.restore();
  palm(c, 120, 1250, 1.1, '#2a1d2e'); palm(c, 960, 1300, 1.25, '#2a1d2e'); palm(c, 300, 1100, 0.45, '#3a2840'); palm(c, 790, 1095, 0.4, '#3a2840');
  const k = ease(seg(lt, 0, 6.5));
  busRear(c, 540, lerp(1820, 1120, k), lerp(1.4, 0.18, Math.pow(k, 0.8)), true);
  // birds
  for (let i = 0; i < 5; i++) { const bx = 200 + i * 90 + lt * 40, by = 520 + Math.sin(i * 2) * 40; const f = Math.sin(lt * 8 + i) * 12; c.strokeStyle = '#3a2440'; c.lineWidth = 5; c.beginPath(); c.moveTo(bx - 22, by - f); c.quadraticCurveTo(bx - 8, by - 8, bx, by); c.quadraticCurveTo(bx + 8, by - 8, bx + 22, by - f); c.stroke(); }
  // end card

// scene start times (seconds); each scene runs until the next one starts
function sceneTimes() {
  const s = id => L(id).start;
  return [
    ['title', 0], ['seatWide', s('v02') + 2.6], ['photo', s('v03') - 0.15], ['storm', s('v04') - 0.2],
    ['seatPush', s('v04') + 3.2], ['wipe', s('v05') - 0.15], ['tear', s('v05') + 3.6], ['runner', s('v06') - 0.2],
    ['door', s('v08') - 0.15], ['talk', s('v09') - 0.2], ['sit', s('v11') - 0.2], ['sunset', s('v12') - 0.15],
  ];
}
let SCT = null;
const XF = 0.35; // crossfade seconds

function caption(c, t) {
  const ln = TL.lines.find(l => t >= l.start - 0.05 && t <= l.end + 0.25);
  if (!ln) return;
  const a = clamp((t - ln.start + 0.05) / 0.15) * clamp((ln.end + 0.25 - t) / 0.2);
  c.save(); c.globalAlpha = a; c.font = '900 56px NotoTe'; c.textAlign = 'center'; c.lineJoin = 'round';
  c.font = '900 52px NotoTe';
  const words = ln.te.split(' '), rows = []; let cur = '';
  for (const w of words) { const tryS = cur ? cur + ' ' + w : w; if (c.measureText(tryS).width > 900 && cur) { rows.push(cur); cur = w; } else cur = tryS; }
  rows.push(cur);
  const tag = ln.who === 'son' ? 'శ్రీను' : ln.who === 'father' ? 'రాములు తాతయ్య' : null;
  const lh = 70, y0 = 1575 - (rows.length - 1) * lh;
  // soft dark band behind the text for readability
  const g = c.createLinearGradient(0, y0 - 130, 0, 1640); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.4, 'rgba(0,0,0,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, y0 - 130, W, 1640 - y0 + 130);
  if (tag) { c.font = '900 36px NotoTe'; c.fillStyle = ln.who === 'son' ? '#8fc3ff' : '#ffd27a'; c.strokeStyle = 'rgba(0,0,0,0.85)'; c.lineWidth = 9; c.strokeText(tag, W / 2, y0 - 66); c.fillText(tag, W / 2, y0 - 66); c.font = '900 52px NotoTe'; }
  rows.forEach((r, i) => { c.strokeStyle = 'rgba(0,0,0,0.9)'; c.lineWidth = 13; c.strokeText(r, W / 2, y0 + i * lh); c.fillStyle = ln.who === 'narrator' ? '#ffffff' : '#fff6d8'; c.fillText(r, W / 2, y0 + i * lh); });
  c.restore();
}
const grain = [];
function makeGrain() { for (let k = 0; k < 6; k++) { const g = document.createElement('canvas'); g.width = 270; g.height = 480; const gc = g.getContext('2d'); const im = gc.createImageData(270, 480); for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 14; } gc.putImageData(im, 0, 0); grain.push(g); } }
function post(c, t) {
  const v = c.createRadialGradient(W / 2, H * 0.45, H * 0.28, W / 2, H * 0.5, H * 0.75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)'); c.fillStyle = v; c.fillRect(0, 0, W, H);
  c.imageSmoothingEnabled = false; c.drawImage(grain[Math.floor(t * 24) % grain.length], 0, 0, W, H); c.imageSmoothingEnabled = true;
}
function drawScene(i, c, t) { const [id, st] = SCT[i]; const sc = SC.find(s => s.id === id); c.save(); sc.draw(c, t - st, t); c.restore(); }
window.renderFrame = function (t) {
  let i = 0; while (i + 1 < SCT.length && t >= SCT[i + 1][1]) i++;
  const ca = bufA.getContext('2d');
  drawScene(i, ca, t);
  X.clearRect(0, 0, W, H); X.drawImage(bufA, 0, 0);
  if (i + 1 < SCT.length && t > SCT[i + 1][1] - XF) {
    // crossfade into the next scene
    const cb = bufB.getContext('2d'); drawScene(i + 1, cb, t);
    X.globalAlpha = clamp((t - (SCT[i + 1][1] - XF)) / XF); X.drawImage(bufB, 0, 0); X.globalAlpha = 1;
  }
  // fade in from black / out to black
  post(X, t);
  caption(X, t);
  const fade = Math.max(clamp(1 - t / 0.6), clamp((t - (TL.duration - 0.7)) / 0.7));
  if (fade > 0) { X.fillStyle = `rgba(0,0,0,${fade})`; X.fillRect(0, 0, W, H); }
};
window.init = async function (timeline) {
  TL = timeline; SCT = sceneTimes(); makeGrain();
  await Promise.all([document.fonts.load('150px Anton'), document.fonts.load('900 56px NotoTe', 'తెలుగు'), document.fonts.load('60px Rama', 'తెలుగు')]);
  return SCT;
};
