<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&family=Caveat:wght@700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;background:#0d0a17;position:relative;color:#fff}
.glow{position:absolute;border-radius:50%;filter:blur(120px)}
.g1{width:900px;height:900px;background:#7a50dc;opacity:.55;left:-200px;top:820px}
.g2{width:700px;height:700px;background:#b38cff;opacity:.35;right:-250px;top:200px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px);background-size:90px 90px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
.badge{position:absolute;top:220px;left:50%;transform:translateX(-50%);background:#ffd84d;color:#14141b;font-weight:900;font-size:38px;letter-spacing:3px;padding:18px 40px;border-radius:999px;box-shadow:0 0 0 8px rgba(255,216,77,.18),0 20px 50px rgba(0,0,0,.4);white-space:nowrap}
.dot{display:inline-block;width:20px;height:20px;background:#e5322d;border-radius:50%;margin-right:16px;vertical-align:2px;box-shadow:0 0 18px #e5322d}
h1{position:absolute;top:335px;width:100%;text-align:center;white-space:nowrap;font-weight:900;font-size:150px;line-height:.9;letter-spacing:-6px;text-transform:uppercase;text-shadow:0 10px 40px rgba(0,0,0,.5)}
.hand{position:absolute;top:600px;width:100%;text-align:center;font-family:Caveat,cursive;font-size:120px;color:#c6a8ff;transform:rotate(-4deg);line-height:1}
.hand u{text-decoration:none;background:none}
.not{position:absolute;top:750px;width:100%;text-align:center;font-size:46px;font-weight:600;color:#d4cfe4}
.not s{text-decoration-color:#e5322d;text-decoration-thickness:6px}
.phone{position:absolute;left:560px;top:870px;width:390px;height:780px;border-radius:64px;background:#111;padding:16px;transform:rotate(6deg);box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 0 3px #3a3550,0 0 80px rgba(122,80,220,.5)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:50px;display:block}
.notch{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:96px;height:26px;background:#000;border-radius:20px}
.free{position:absolute;top:1690px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:38px;letter-spacing:1px;background:#fff;color:#14141b;padding:20px 40px;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.free span{color:#7a50dc}
.url{position:absolute;top:1800px;width:100%;text-align:center;font-weight:600;font-size:30px;color:#cfc8e6;letter-spacing:1px}
.feats{position:absolute;left:70px;top:900px;display:flex;flex-direction:column;gap:16px}
.f{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);padding:18px 28px 18px 18px;border-radius:24px;font-weight:800;font-size:36px;white-space:nowrap;box-shadow:0 14px 36px rgba(0,0,0,.35)}
.f i{font-style:normal;width:64px;height:64px;display:grid;place-items:center;background:#7a50dc;border-radius:18px;font-size:34px}
.f.hl{background:#ffd84d;color:#14141b;border-color:#ffd84d}
.f.hl i{background:#14141b}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
<div class="badge"><span class="dot"></span>JUST LAUNCHED</div>
<h1>Exam notes<br>in 60 sec</h1>
<div class="hand"><u>+ handwritten!</u></div>
<div class="not"><s>not all-nighters</s> 😮‍💨</div>
<div class="feats">
<div class="f"><i>🧠</i>AI Summary</div>
<div class="f"><i>❓</i>Ask your notes</div>
<div class="f"><i>🗺️</i>Mind maps</div>
<div class="f"><i>🃏</i>Flashcards</div>
<div class="f"><i>✅</i>Quiz</div>
<div class="f hl"><i>✍️</i>Handwritten PDF</div>
</div>
<div class="phone"><img src="site.png"><div class="notch"></div></div>
<div class="free">100% <span>FREE</span> · NO LOGIN · B.Tech &amp; Diploma</div>
<div class="url">devendra154-bot.github.io/myself-/notes</div>
</body></html>
