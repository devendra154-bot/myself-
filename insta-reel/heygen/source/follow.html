<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root{--pu:#7c4dff;--bl:#0d99ff;--ink:#1e1e2a;--mu:#7a7a8c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f6f2ff;font-family:'Inter',sans-serif;color:var(--ink)}
#soft{position:absolute;inset:0;background:linear-gradient(165deg,#f6f2ff 0%,#eef5ff 45%,#fff4ee 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.gt{background:linear-gradient(90deg,#7c4dff,#0d99ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{position:absolute;border-radius:32px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.05),0 24px 50px rgba(40,30,90,.12)}
#brand{position:absolute;left:60px;right:60px;top:80px;display:flex;justify-content:space-between;align-items:center}
#brand .a{padding:14px 26px;border-radius:999px;background:#fff;box-shadow:0 10px 30px rgba(40,30,90,.12);font-family:'Inter Display';font-weight:900;font-size:30px}
#brand .b{padding:12px 22px;border-radius:999px;background:linear-gradient(90deg,#7c4dff,#0d99ff);color:#fff;font-family:'JetBrains Mono';font-weight:800;font-size:20px;letter-spacing:3px}
.kick{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:'JetBrains Mono';font-weight:800;font-size:26px;letter-spacing:8px;color:var(--mu)}
.big{position:absolute;left:0;right:0;top:350px;text-align:center;font-family:'Inter Display';font-weight:900;font-size:230px;letter-spacing:-6px;line-height:1;white-space:nowrap}
#prof{left:110px;right:110px;top:630px;padding:46px 50px 64px;text-align:center}
.av{width:220px;height:220px;margin:0 auto;border-radius:50%;padding:9px;background:conic-gradient(#7c4dff,#0d99ff,#ff8a65,#7c4dff)}
.av div{width:100%;height:100%;border-radius:50%;background:#fff;border:7px solid #fff;display:flex;align-items:center;justify-content:center}
.av span{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#efe8ff,#e3f2ff);display:flex;align-items:center;justify-content:center;font-family:'Inter Display';font-weight:900;font-size:86px}
.nm{margin-top:30px;font-family:'Inter Display';font-weight:900;font-size:64px}
.hd{margin-top:6px;font-family:'JetBrains Mono';font-weight:700;font-size:30px;color:var(--mu)}
.sub{margin-top:18px;font-size:32px;font-weight:600;color:#55556a}
.stats{display:flex;justify-content:center;gap:16px;margin-top:28px}
.stats div{padding:10px 22px;border-radius:999px;background:#f4f1ff;font-weight:700;font-size:26px;color:#5b47b8}
.btn{position:relative;margin:40px auto 0;width:520px;height:116px;border-radius:999px;background:linear-gradient(90deg,#7c4dff,#0d99ff);color:#fff;font-family:'Inter Display';font-weight:900;font-size:52px;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 20px 40px rgba(80,70,255,.35)}
.ring{position:absolute;inset:-18px;border-radius:999px;border:4px solid rgba(124,77,255,.35)}
.ring2{position:absolute;inset:-38px;border-radius:999px;border:3px solid rgba(13,153,255,.18)}
.cur{position:absolute;right:40px;bottom:-62px;width:84px;height:84px}
.line{position:absolute;left:90px;right:90px;top:1460px;text-align:center;font-family:'Inter Display';font-weight:900;font-size:56px;line-height:1.25}
.chips{position:absolute;left:0;right:0;top:1640px;display:flex;justify-content:center;gap:18px}
.chip{padding:16px 28px;border-radius:999px;background:#fff;box-shadow:0 10px 26px rgba(40,30,90,.1);font-weight:800;font-size:28px}
.spark{position:absolute;font-size:44px}
</style></head><body>
<div id="soft"><div class="blob" style="left:-150px;top:200px;width:600px;height:600px;background:#c9b6ff"></div><div class="blob" style="left:600px;top:700px;width:560px;height:560px;background:#a9d8ff"></div><div class="blob" style="left:100px;top:1300px;width:520px;height:520px;background:#ffd0bd"></div></div>
<div id="brand"><div class="a">Dev Inventor <span class="gt">✦</span></div><div class="b">AI TOOLS</div></div>
<div class="kick">DON'T MISS THE NEXT ONE</div>
<div class="big gt">FOLLOW</div>
<div class="card" id="prof">
  <div class="av"><div><span><b class="gt">DI</b></span></div></div>
  <div class="nm">Dev Inventor</div>
  <div class="hd">@devinventor2010</div>
  <div class="sub">AI tools · Tenglish tips · Tech projects</div>
  <div class="stats"><div>🤖 AI hacks</div><div>🎬 Reels</div><div>⚡ Projects</div></div>
  <div class="btn"><div class="ring2"></div><div class="ring"></div>＋ Follow
    <svg class="cur" viewBox="0 0 24 24"><path d="M5 2l14 9-6.2 1.3L16 19l-2.6 1.3-3.3-6.9L5 17z" fill="#1e1e2a" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>
</div>
<span class="spark gt" style="left:120px;top:590px">✦</span>
<span class="spark gt" style="left:910px;top:1300px">✦</span>
<span class="spark" style="left:930px;top:580px;color:#ff8a65;font-size:34px">●</span>
<div class="line">Ilanti AI tools content kosam <span class="gt">follow</span> cheyyandi!</div>
<div class="chips"><div class="chip">🔔 Notifications on</div><div class="chip">📌 Save</div><div class="chip">↗ Share</div></div>
</body></html>
