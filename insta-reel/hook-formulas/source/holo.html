<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root{--bg:#07060c;--tx:#eef0f6;--mu:#9aa0b4;--p:#ffb8e6;--c:#a8f0ff;--l:#d4c6ff;--m:#c6ffe0;--o:#ffe0bf}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'Inter',sans-serif;color:var(--tx)}
#stage{position:absolute;inset:0;overflow:hidden}
.hb{position:absolute;border-radius:50%;filter:blur(140px);opacity:.28}
.scene{position:absolute;inset:0;opacity:0;perspective:1600px}
.abs{position:absolute}
.mono{font-family:'JetBrains Mono',monospace}
.chrome{font-family:'Inter Display';font-weight:900;letter-spacing:-.04em;line-height:.9;
 background:linear-gradient(100deg,#7d889c 0%,#ffffff 14%,#aeb6c4 26%,#ffd0ee 38%,#c4f4ff 48%,#ffffff 56%,#e4d8ff 66%,#8e98ab 80%,#f2f4f8 100%);background-size:260% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(20,20,40,.75)) drop-shadow(0 0 26px rgba(200,225,255,.35))}
.foil{position:absolute;border-radius:32px;padding:3px;background:linear-gradient(120deg,#ffb8e6,#a8f0ff,#d4c6ff,#c6ffe0,#ffe0bf,#ffb8e6);background-size:300% 300%;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 40px rgba(200,220,255,.18)}
.foil>.in{width:100%;height:100%;border-radius:29px;background:linear-gradient(160deg,rgba(22,20,34,.94),rgba(10,9,16,.96));position:relative;overflow:hidden}
.foil>.in::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.10) 45%,rgba(200,240,255,.14) 50%,transparent 62%)}
.lbl{font-family:'JetBrains Mono';font-weight:700;font-size:24px;letter-spacing:5px;color:var(--mu)}
#hud{position:absolute;top:66px;left:70px;right:70px;display:flex;justify-content:space-between;align-items:center}
#hud .a{font-family:'JetBrains Mono';font-weight:700;font-size:26px;letter-spacing:5px;color:#dfe3ee}
#hud .b{padding:10px 22px;border-radius:999px;font-family:'JetBrains Mono';font-weight:800;font-size:22px;letter-spacing:3px;color:#111;background:linear-gradient(90deg,#ffb8e6,#a8f0ff,#c6ffe0)}
#capbar{position:absolute;left:60px;right:60px;top:1475px;min-height:210px;border-radius:34px;padding:3px;background:linear-gradient(120deg,#ffb8e6,#a8f0ff,#d4c6ff,#c6ffe0,#ffb8e6);background-size:300% 300%}
#capbar .in{position:relative;min-height:204px;border-radius:31px;background:rgba(10,9,16,.92);padding:34px 42px}
#capbar .tg{position:absolute;left:42px;top:-20px;padding:6px 16px;border-radius:999px;background:#eef0f6;color:#111;font-family:'JetBrains Mono';font-weight:800;font-size:19px;letter-spacing:2px}
.cap{position:absolute;left:42px;right:42px;top:34px;font-family:'Inter Display';font-weight:900;font-size:58px;line-height:1.18;letter-spacing:-1px;opacity:0}
.cap .w{display:inline-block;margin-right:15px;opacity:.28}
.cap .hl{color:#111;padding:0 12px;border-radius:12px;background:linear-gradient(100deg,#ffb8e6,#a8f0ff 50%,#c6ffe0);background-size:200% 100%}
#morph{position:absolute;left:540px;top:900px;width:0;height:0;z-index:40;pointer-events:none}
#morph div{position:absolute;left:-200px;top:-200px;width:400px;height:400px;background:linear-gradient(120deg,#ffb8e6,#a8f0ff,#d4c6ff,#c6ffe0,#ffe0bf);opacity:0}
svg{overflow:visible}
</style></head>
<body><div id="stage">
<div id="holo"></div>
<div id="hud"><div class="a">DEV INVENTOR ◇ HOOK LAB</div><div class="b">5 FORMULAS</div></div>
<div id="scenes"></div>
<div id="capbar"><div class="in"><div class="tg">TENGLISH CC</div></div></div>
<div id="morph"></div>
</div>
<script>
const TL=__TIMELINE__;const NAME='Dev Inventor';
const E={out:'cubic-bezier(.16,1,.3,1)',back:'cubic-bezier(.34,1.56,.64,1)',io:'cubic-bezier(.65,0,.35,1)'};
const A=(el,kf,st,du,ea=E.out,fill='both',x={})=>el.animate(kf,Object.assign({delay:st*1000,duration:du*1000,fill,easing:ea},x));
const H=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const add=(p,h)=>{const e=H(h);p.appendChild(e);return e};
const fadeTo=(el,t,kf,d=.35)=>A(el,kf,t,d,E.io,'forwards');
const T=TL.total;
const shimmer=(el,t0=0,per=2.6)=>A(el,[{backgroundPosition:'0% 50%'},{backgroundPosition:'100% 50%'},{backgroundPosition:'0% 50%'}],t0,per,'ease-in-out','none',{iterations:Math.ceil((T-t0)/per)+1});
// chrome text: liquid rise + 3D tilt
const liq=(el,t,d=.8)=>A(el,[{opacity:0,transform:'translateY(90px) rotateX(70deg) scale(.9)',filter:'blur(14px)'},{opacity:1,transform:'none',filter:'blur(0)'}],t,d,E.out);
const pop=(el,t,d=.55)=>A(el,[{opacity:0,transform:'scale(.4) rotate(-6deg)'},{opacity:1,transform:'scale(1) rotate(0)'}],t,d,E.back);
const foilIn=(el,t,d=.75)=>A(el,[{opacity:0,transform:'rotateY(-70deg) translateX(-200px)'},{opacity:1,transform:'none'}],t,d,E.out);
function chromeTxt(par,html,{x=70,y=200,size=150,w=940,align='left',t}){const e=add(par,`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;text-align:${align}"><div class="chrome" style="font-size:${size}px">${html}</div></div>`);liq(e,t);shimmer(e.firstChild,t);return e;}
function foil(par,{x,y,w,h,t,html='',pad=40}){const f=add(par,`<div class="foil" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="in" style="padding:${pad}px">${html}</div></div>`);foilIn(f,t);shimmer(f,t,3.4);return f;}

// holo background blobs
const HB=document.getElementById('holo');
[['#ffb8e6',-200,0,800],['#a8f0ff',500,400,900],['#d4c6ff',-150,1000,800],['#c6ffe0',600,1300,700]].forEach((b,i)=>{const e=add(HB,`<div class="hb" style="background:${b[0]};left:${b[1]}px;top:${b[2]}px;width:${b[3]}px;height:${b[3]}px"></div>`);
 A(e,[{transform:'translate(0,0) scale(1)'},{transform:`translate(${i%2?-160:180}px,${i<2?140:-120}px) scale(1.15)`},{transform:`translate(${i%2?100:-90}px,${i<2?-70:80}px) scale(.95)`},{transform:'translate(0,0) scale(1)'}],0,T,'ease-in-out','none');});
A(document.getElementById('hud'),[{opacity:0,transform:'translateY(-40px)'},{opacity:1,transform:'none'}],.2,.6);
shimmer(document.querySelector('#hud .b'),0,2.4);shimmer(document.getElementById('capbar'),0,3.6);

// timings
const lines=TL.lines,sc={},order=[];
lines.forEach(l=>{if(!sc[l.scene]){sc[l.scene]={lines:[]};order.push(l.scene)}sc[l.scene].lines.push(l)});
order.forEach((k,i)=>sc[k].start=i?sc[k].lines[0].start-.45:0);
order.forEach((k,i)=>sc[k].end=i<order.length-1?sc[order[i+1]].start:TL.total);
const L=(s,i)=>s.lines[i].start, Le=(s,i)=>s.lines[i].end;
const S=document.getElementById('scenes'),MO=document.getElementById('morph');
function liquidMorph(t){const b=add(MO,`<div></div>`);
 A(b,[{opacity:0,transform:'scale(0) rotate(0)',borderRadius:'50% 50% 50% 50%'},{opacity:1,transform:'scale(2.2) rotate(60deg)',borderRadius:'38% 62% 55% 45% / 45% 38% 62% 55%',offset:.35},{opacity:1,transform:'scale(6.5) rotate(140deg)',borderRadius:'60% 40% 35% 65% / 55% 60% 40% 45%',offset:.6},{opacity:0,transform:'scale(7) rotate(170deg)',borderRadius:'50%'}],t,.75,E.io,'none');}
function mk(k){const s=sc[k];s.el=add(S,`<div class="scene"></div>`);
 if(s.start>0){liquidMorph(s.start-.38);A(s.el,[{opacity:0,transform:'scale(1.12)',filter:'blur(16px)'},{opacity:1,transform:'scale(1)',filter:'blur(0)'}],s.start+.02,.5,E.out);}
 else A(s.el,[{opacity:0},{opacity:1}],0,.3,'linear');
 if(k!=='follow')A(s.el,[{opacity:1},{opacity:0}],s.end-.05,.12,'linear','forwards');
 return s;}

/* HOOK — phone feed scrolling past */
(()=>{const s=mk('hook');
 chromeTxt(s.el,'3 SEC?',{y:200,size:230,t:.3});
 const ph=add(s.el,`<div class="abs" style="left:300px;top:470px;width:480px;height:840px;border-radius:60px;border:10px solid #2a2a33;background:#0d0c14;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.7)"><div class="feed abs" style="left:0;top:0;width:100%"></div></div>`);
 A(ph,[{opacity:0,transform:'translateY(300px) rotateX(30deg)'},{opacity:1,transform:'none'}],.5,.7,E.out);
 const feed=ph.querySelector('.feed');const cols=['#ffb8e6','#a8f0ff','#d4c6ff','#c6ffe0','#ffe0bf'];
 for(let i=0;i<14;i++)add(feed,`<div style="height:300px;margin:14px;border-radius:24px;background:linear-gradient(160deg,${cols[i%5]}55,#14121e);display:flex;align-items:flex-end;padding:20px"><div style="height:16px;width:${40+(i*13)%50}%;border-radius:8px;background:rgba(255,255,255,.4)"></div></div>`);
 A(feed,[{transform:'translateY(0)'},{transform:'translateY(-3600px)'}],.8,L(s,1)-.8,'cubic-bezier(.5,0,.5,1)','forwards');
 const sw=add(s.el,`<div class="abs mono" style="left:110px;top:1040px;font-size:30px;color:var(--p);transform:rotate(-8deg)">swipe… swipe…</div>`);A(sw,[{opacity:0},{opacity:1}],1.2,.3,E.io);
 const st=add(s.el,`<div class="abs" style="left:0;width:1080px;text-align:center;top:780px"><div class="chrome" style="font-size:200px">HOOK</div></div>`);
 A(st,[{opacity:0,transform:'scale(2.4)',filter:'blur(20px)'},{opacity:1,transform:'scale(1)',filter:'blur(0)'}],L(s,1)+.3,.5,E.out);shimmer(st.firstChild,L(s,1));
 fadeTo(ph,L(s,1)+.2,[{opacity:1,filter:'blur(0)'},{opacity:.25,filter:'blur(8px)'}],.4);
 const badge=foil(s.el,{x:290,y:1130,w:500,h:140,t:L(s,1)+1,pad:0,html:`<div style="height:100%;display:flex;align-items:center;justify-content:center;font-family:'Inter Display';font-weight:900;font-size:58px;letter-spacing:-1px">5 FORMULAS ◇</div>`});
})();

/* FORMULAS */
const F=[
 {k:'f1',n:'01',name:'Question',ex:'"Meeku idi telusa?"',ico:'?'},
 {k:'f2',n:'02',name:'Shock',ex:'"Ee video nenu edit cheyyaledu"',ico:'!'},
 {k:'f3',n:'03',name:'Number',ex:'"5 prompts · 10 seconds"',ico:'#'},
 {k:'f4',n:'04',name:'Mistake',ex:'"Meeru ee tappu chestunnara?"',ico:'✕'},
 {k:'f5',n:'05',name:'Promise',ex:'"End varaku chusthe, secret cheptha"',ico:'◆'},
];
F.forEach((f,fi)=>{const s=mk(f.k);
 const num=chromeTxt(s.el,f.n,{x:60,y:170,size:340,w:600,t:s.start+.1});
 A(num,[{transform:'rotateY(0)'},{transform:'rotateY(-14deg)'},{transform:'rotateY(0)'}],s.start+1,2.4,E.io,'none',{iterations:3,composite:'add'});
 const ic=add(s.el,`<div class="abs" style="left:700px;top:230px;width:260px;height:260px;border-radius:50%;padding:4px;background:linear-gradient(120deg,#ffb8e6,#a8f0ff,#d4c6ff,#c6ffe0);background-size:300% 300%"><div style="width:100%;height:100%;border-radius:50%;background:#0d0c14;display:flex;align-items:center;justify-content:center"><span class="chrome" style="font-size:170px">${f.ico}</span></div></div>`);
 pop(ic,s.start+.35);shimmer(ic,s.start,3);shimmer(ic.querySelector('.chrome'),s.start);
 A(ic,[{transform:'translateY(0) rotate(0)'},{transform:'translateY(-16px) rotate(6deg)'},{transform:'translateY(0) rotate(0)'}],s.start+1,2,E.io,'none',{iterations:3,composite:'add'});
 const nm=foil(s.el,{x:70,y:600,w:940,h:220,t:L(s,0)+.15,pad:40,html:`<div class="lbl">FORMULA ${f.n}</div><div style="font-family:'Inter Display';font-weight:900;font-size:96px;letter-spacing:-3px;margin-top:10px">${f.name} <span style="font-weight:700;color:var(--mu)">hook</span></div>`});
 const bub=add(s.el,`<div class="abs" style="left:70px;top:870px;width:940px;min-height:300px;border-radius:40px 40px 40px 10px;background:rgba(238,240,246,.96);color:#111;padding:44px 50px"><div class="lbl" style="color:#6b7186">EXAMPLE HOOK</div><div class="ex" style="margin-top:20px;font-family:'Inter Display';font-weight:900;font-size:${f.ex.length>30?62:76}px;line-height:1.08;letter-spacing:-2px"></div></div>`);
 A(bub,[{opacity:0,transform:'translateY(80px) scale(.92)'},{opacity:1,transform:'none'}],L(s,1)-.15,.55,E.back);
 const ex=bub.querySelector('.ex');const ws=f.ex.split(' ');const span=Math.max(.6,(Le(s,1)-L(s,1))*.8);
 ws.forEach((w,i)=>{const e=add(ex,`<span style="display:inline-block;margin-right:16px">${w}</span>`);A(e,[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],L(s,1)+.1+span*i/ws.length,.3,E.back);});
 const sh=add(bub,`<div class="abs" style="top:0;bottom:0;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgba(255,184,230,.45),rgba(168,240,255,.45),transparent);transform:skewX(-18deg)"></div>`);bub.style.overflow='hidden';
 A(sh,[{left:'-40%'},{left:'130%'}],Le(s,1)-.1,.8,E.io);
 const stop=add(s.el,`<div class="abs mono" style="left:70px;top:1220px;font-size:28px;letter-spacing:3px;color:var(--m)">◇ SCROLL STOPPED ✓</div>`);A(stop,[{opacity:0,transform:'translateX(-30px)'},{opacity:1,transform:'none'}],Le(s,1)+.05,.35,E.out);
});

/* TIP */
(()=>{const s=mk('tip');
 chromeTxt(s.el,'Claude ki<br>adugu',{y:190,size:150,t:s.start+.1});
 const pc=foil(s.el,{x:70,y:560,w:940,h:300,t:L(s,0)+.1,pad:40,html:`<div class="lbl">PROMPT</div><div class="ty mono" style="margin-top:18px;font-size:38px;line-height:1.5;font-weight:700"></div>`});
 const txt='"Naa topic ki ee 5 formulas lo hooks ivvu"';const ty=pc.querySelector('.ty');const chars=[...txt];const span=(Le(s,0)-L(s,0))*.55;
 chars.forEach((ch,i)=>{const e=add(ty,`<span>${ch===' '?' ':ch}</span>`);A(e,[{opacity:0},{opacity:1}],L(s,0)+.3+span*i/chars.length,.01,'linear');});
 const outs=['? Question','! Shock','# Number','✕ Mistake','◆ Promise'];
 outs.forEach((o,i)=>{const y=900+Math.floor(i/2)*150,x=70+(i%2)*480,w=i==4?940:460;const e=add(s.el,`<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:126px;border-radius:24px;background:rgba(238,240,246,.08);border:2px solid rgba(238,240,246,.25);display:flex;align-items:center;gap:20px;padding:0 30px;font-family:'Inter Display';font-weight:900;font-size:48px">${o}<span class="mono" style="margin-left:auto;font-size:24px;color:var(--m)">✓ ready</span></div>`);
  A(e,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],L(s,0)+span+.5+i*.18,.45,E.back);});
})();

/* CTA */
(()=>{const s=mk('cta');
 chromeTxt(s.el,'Fav formula?',{y:200,size:130,t:s.start+.1});
 const nums=['01','02','03','04','05'];const els=nums.map((n,i)=>{const e=add(s.el,`<div class="foil" style="left:${70+i*190}px;top:440px;width:170px;height:200px"><div class="in" style="display:flex;align-items:center;justify-content:center"><span class="chrome" style="font-size:96px">${n}</span></div></div>`);
  A(e,[{opacity:0,transform:'rotateY(90deg)'},{opacity:1,transform:'rotateY(0)'}],s.start+.3+i*.1,.5,E.out);shimmer(e,s.start,3);return e;});
 const cm=foil(s.el,{x:70,y:720,w:940,h:600,t:s.start+.5,pad:40,html:`<div class="lbl">COMMENTS</div><div class="lst" style="margin-top:20px"></div>`});
 const lst=cm.querySelector('.lst');
 [['@friend1','02 shock hook 🔥'.replace(' 🔥','!')],['@friend2','05 best']].forEach(([u,t])=>add(lst,`<div style="display:flex;align-items:center;gap:20px;margin-top:22px;font-size:40px;font-weight:700"><span style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ffb8e6,#a8f0ff)"></span><span class="mono" style="font-size:28px;color:var(--mu)">${u}</span>${t}</div>`));
 const nc=add(lst,`<div style="display:flex;align-items:center;gap:20px;margin-top:22px;font-size:46px;font-weight:900;opacity:0"><span style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#c6ffe0,#d4c6ff)"></span><span class="mono" style="font-size:28px;color:var(--mu)">@you</span><span class="chrome" style="font-size:60px">03</span></div>`);
 const tap=L(s,0)+2.2;A(nc,[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],tap,.45,E.back,'forwards');
 A(els[2],[{transform:'translateY(0) scale(1)'},{transform:'translateY(-30px) scale(1.08)'}],tap-.2,.4,E.back,'forwards');
})();

/* FOLLOW — chrome FOLLOW on one line */
(()=>{const s=mk('follow');
 chromeTxt(s.el,'FOLLOW',{x:0,w:1080,y:240,size:220,align:'center',t:s.start+.15});
 const fm=add(s.el,`<div class="abs mono" style="left:0;width:1080px;text-align:center;top:470px;font-size:34px;letter-spacing:6px;color:#dfe3ee">◇ FOR MORE CONTENT ◇</div>`);A(fm,[{opacity:0,letterSpacing:'30px'},{opacity:1,letterSpacing:'6px'}],s.start+.5,.7,E.out);
 const pc=foil(s.el,{x:140,y:580,w:800,h:500,t:s.start+.45,pad:0,html:`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px"><div style="width:190px;height:190px;border-radius:50%;padding:6px;background:linear-gradient(120deg,#ffb8e6,#a8f0ff,#c6ffe0)"><div style="width:100%;height:100%;border-radius:50%;background:#0d0c14;display:flex;align-items:center;justify-content:center"><span class="chrome" style="font-size:90px">DI</span></div></div><div class="chrome" style="font-size:72px">${NAME}</div><div class="mono" style="font-size:24px;letter-spacing:3px;color:var(--mu)">CLAUDE · AI HACKS · TELUGU</div></div>`});
 pc.querySelectorAll('.chrome').forEach(e=>shimmer(e,s.start));
 const btn=add(s.el,`<div class="abs" style="left:190px;top:1130px;width:700px;height:160px;border-radius:999px;background:linear-gradient(100deg,#ffb8e6,#a8f0ff,#d4c6ff,#c6ffe0);background-size:250% 100%;display:flex;align-items:center;justify-content:center;font-family:'Inter Display';font-weight:900;font-size:80px;color:#111;box-shadow:0 0 70px rgba(200,230,255,.45)"><span class="a">Follow</span><span class="b abs" style="opacity:0;color:#eef0f6">Following ✓</span></div>`);
 pop(btn,L(s,0)+.25);shimmer(btn,s.start,2);
 const tap=Le(s,0)+.1;
 const cur=add(s.el,`<div class="abs" style="left:900px;top:1500px;width:64px;height:64px;z-index:9"><svg width="64" height="64" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg></div>`);
 A(cur,[{opacity:0,transform:'translate(0,0)'},{opacity:1,transform:'translate(-300px,-300px)'}],tap-.7,.6,E.out);
 A(cur,[{transform:'translate(-300px,-300px) scale(1)'},{transform:'translate(-300px,-300px) scale(.75)'},{transform:'translate(-300px,-300px) scale(1)'}],tap,.25,E.io,'forwards');
 A(btn,[{background:'linear-gradient(100deg,#ffb8e6,#a8f0ff,#d4c6ff,#c6ffe0)'},{background:'linear-gradient(100deg,#1a1826,#232033)'}],tap+.05,.3,E.io,'forwards');
 A(btn.querySelector('.a'),[{opacity:1},{opacity:0}],tap,.15,E.io,'forwards');A(btn.querySelector('.b'),[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],tap+.1,.4,E.back);
 liquidMorph(tap-.1);
})();

/* CAPTIONS */
const CB=document.querySelector('#capbar .in');A(document.getElementById('capbar'),[{opacity:0,transform:'translateY(60px)'},{opacity:1,transform:'none'}],.3,.6);
lines.forEach((l,idx)=>{
 const ws=l.cap.replace(/\*([^*]+)\*/g,(m,g)=>g.split(' ').map(w=>'§'+w).join(' ')).split(' ');
 const plain=l.cap.replace(/\*/g,'');const fs=plain.length>62?46:plain.length>46?52:58;
 const el=add(CB,`<div class="cap" style="font-size:${fs}px"></div>`);const dur=(l.end-l.start)*.92;
 ws.forEach((w,i)=>{const hl=w.startsWith('§');const e=add(el,`<span class="w${hl?' hl':''}">${w.replace('§','')}</span>`);
  const t=l.start+dur*i/ws.length;A(e,[{opacity:.28},{opacity:1}],t,.1,'linear');
  if(hl){A(e,[{transform:'scale(1)',backgroundPosition:'0% 0'},{transform:'scale(1.08)',backgroundPosition:'100% 0',offset:.5},{transform:'scale(1)',backgroundPosition:'100% 0'}],t,.5,E.out,'forwards');}});
 const nxt=idx<lines.length-1?lines[idx+1].start:TL.total;
 A(el,[{opacity:0,transform:'translateY(18px)',filter:'blur(6px)'},{opacity:1,transform:'none',filter:'blur(0)'}],l.start-.15,.2,E.out);
 A(el,[{opacity:1},{opacity:0}],Math.min(nxt-.15,l.end+.7),.12,'linear','forwards');
});
window.seek=t=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000});
seek(0);window.READY=true;
</script></body></html>
