<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root{--ink:#1d1b19;--paper:#f3ecdf;--kraft:#c9a77a;--yel:#ffe45c;--pink:#ff8fb1;--blu:#7cc6ff;--grn:#9be38f;--red:#e8452c;--mu:#6f665c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--kraft);font-family:'Inter',sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden}
.kraft{position:absolute;inset:0;background:
 radial-gradient(circle at 20% 15%,rgba(255,255,255,.18),transparent 40%),
 radial-gradient(circle at 80% 85%,rgba(0,0,0,.18),transparent 45%),#c49f70}
.fib{position:absolute;inset:0;opacity:.22;background-image:repeating-linear-gradient(17deg,rgba(80,50,20,.25) 0 1px,transparent 1px 7px),repeating-linear-gradient(-31deg,rgba(255,255,255,.18) 0 1px,transparent 1px 11px)}
.grain{position:absolute;inset:-40px;opacity:.18;background-image:radial-gradient(rgba(0,0,0,.6) 1px,transparent 1.3px);background-size:4px 4px}
/* main notebook sheet */
#sheet{position:absolute;left:40px;top:150px;width:1000px;height:1270px;background:var(--paper);
 background-image:linear-gradient(90deg,transparent 88px,rgba(232,69,44,.35) 88px,rgba(232,69,44,.35) 91px,transparent 91px),repeating-linear-gradient(transparent 0 58px,rgba(70,120,200,.18) 58px 60px);
 box-shadow:0 30px 60px rgba(60,35,10,.45);clip-path:polygon(0 1%,3% 0,9% .8%,15% .2%,24% .9%,31% .1%,40% .7%,48% 0,57% .8%,66% .2%,74% .9%,83% .1%,91% .8%,97% 0,100% 1%,100% 100%,0 100%)}
.holes{position:absolute;left:20px;top:0;bottom:0;width:30px;display:flex;flex-direction:column;justify-content:space-around}
.holes i{width:26px;height:26px;border-radius:50%;background:#c49f70;box-shadow:inset 0 3px 5px rgba(0,0,0,.35)}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.hand{font-family:'Comic Neue','Inter',sans-serif;font-weight:700}
.mono{font-family:'JetBrains Mono',monospace}
.strip{position:absolute;padding:14px 34px;background:#fffdf7;box-shadow:0 8px 14px rgba(60,35,10,.3);font-family:'Inter Display';font-weight:900;letter-spacing:-2px;line-height:1;
 clip-path:polygon(0 6%,4% 0,12% 5%,20% 1%,30% 6%,41% 0,52% 5%,63% 1%,74% 6%,85% 0,93% 5%,100% 2%,99% 94%,92% 100%,82% 95%,71% 100%,60% 94%,49% 100%,38% 95%,27% 100%,16% 94%,7% 100%,1% 96%)}
.tape{position:absolute;width:150px;height:44px;background:rgba(240,225,190,.75);box-shadow:0 2px 4px rgba(0,0,0,.15);
 clip-path:polygon(3% 0,97% 4%,100% 30%,96% 55%,100% 80%,97% 100%,3% 96%,0 70%,4% 45%,0 20%)}
.note{position:absolute;box-shadow:0 14px 20px rgba(60,35,10,.35);padding:30px;font-family:'Comic Neue';font-weight:700}
.card{position:absolute;background:#fff;box-shadow:0 14px 24px rgba(60,35,10,.35);padding:34px 38px;background-image:repeating-linear-gradient(transparent 0 52px,rgba(70,120,200,.2) 52px 54px);background-position:0 30px}
.num{position:absolute;font-family:'Inter Display';font-weight:900;font-size:230px;line-height:.8;letter-spacing:-10px;color:var(--ink);padding:24px 28px 10px;background:var(--yel);box-shadow:0 14px 20px rgba(60,35,10,.35);
 clip-path:polygon(2% 4%,10% 0,22% 3%,35% 0,50% 4%,64% 0,78% 3%,90% 0,98% 5%,100% 30%,97% 55%,100% 80%,97% 100%,80% 97%,62% 100%,45% 97%,28% 100%,12% 96%,0 100%,2% 70%,0 40%)}
.stamp{position:absolute;padding:10px 30px;border:7px solid var(--red);border-radius:14px;color:var(--red);font-family:'Inter Display';font-weight:900;font-size:76px;letter-spacing:3px;opacity:.9;mix-blend-mode:multiply}
.hl{background:linear-gradient(transparent 35%,var(--yel) 35%,var(--yel) 88%,transparent 88%);padding:0 6px}
svg{overflow:visible}
#hud{position:absolute;top:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
#brand{font-family:'Comic Neue';font-weight:700;font-size:34px;color:#2b1d0e;background:#fffdf7;padding:8px 22px;transform:rotate(-2deg);box-shadow:0 6px 10px rgba(60,35,10,.3)}
#hud .tag2{font-family:'JetBrains Mono';font-weight:700;font-size:24px;letter-spacing:3px;color:#fffdf7;background:var(--ink);padding:10px 18px;transform:rotate(2deg)}
/* captions on a torn strip */
#capbar{position:absolute;left:50px;right:50px;top:1470px;min-height:230px;background:#fffdf7;box-shadow:0 18px 30px rgba(60,35,10,.4);padding:40px 48px;transform:rotate(-1deg);
 clip-path:polygon(0 4%,5% 0,13% 3%,22% 0,33% 4%,45% 1%,57% 4%,68% 0,79% 3%,90% 0,100% 3%,99% 96%,90% 100%,80% 97%,68% 100%,56% 96%,44% 100%,32% 97%,20% 100%,9% 96%,0 99%)}
#capbar .tg{position:absolute;right:40px;top:14px;font-family:'JetBrains Mono';font-size:18px;letter-spacing:2px;color:var(--mu)}
.cap{position:absolute;left:48px;right:48px;top:44px;font-weight:800;font-size:56px;line-height:1.28;letter-spacing:-.5px;opacity:0}
.cap .w{display:inline-block;opacity:.25;margin-right:13px;position:relative}
.cap .k{position:relative;z-index:1}
.cap .mk{position:absolute;left:-6px;right:-6px;top:38%;bottom:6%;background:var(--yel);z-index:0;transform-origin:left;border-radius:4px 10px 6px 12px}
#rip{position:absolute;left:-1200px;top:0;width:1200px;height:1920px;background:#fffdf7;box-shadow:0 0 60px rgba(60,35,10,.5);
 clip-path:polygon(0 0,92% 0,96% 4%,91% 9%,97% 14%,92% 20%,98% 26%,93% 32%,99% 38%,94% 44%,100% 50%,94% 56%,99% 62%,93% 68%,98% 74%,92% 80%,97% 86%,91% 92%,96% 100%,0 100%)}
</style></head>
<body><div id="stage">
<div class="kraft"></div><div class="fib"></div><div class="grain" id="grain"></div>
<div id="sheet"><div class="holes"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<div id="hud"><div id="brand">✎ Dev Inventor's prompt notebook</div><div class="tag2">5 PROMPTS</div></div>
<div id="scenes"></div>
<div id="capbar"><div class="tg">TENGLISH CC</div></div>
<div id="rip"></div>
</div>
<script>
const TL=__TIMELINE__;
const NAME='Dev Inventor';
const E={out:'cubic-bezier(.16,1,.3,1)',back:'cubic-bezier(.34,1.56,.64,1)',io:'cubic-bezier(.65,0,.35,1)'};
const A=(el,kf,st,du,ea=E.out,fill='both',x={})=>el.animate(kf,Object.assign({delay:st*1000,duration:du*1000,fill,easing:ea},x));
const H=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const add=(p,h)=>{const e=H(h);p.appendChild(e);return e};
// "placed by hand": drops in with a slight overshoot rotation
const place=(el,t,rot=0,d=.55,from='translateY(-120px)')=>A(el,[{opacity:0,transform:`${from} rotate(${rot-12}deg) scale(1.15)`},{opacity:1,transform:`translateY(0) rotate(${rot+2}deg) scale(.98)`,offset:.75},{opacity:1,transform:`rotate(${rot}deg) scale(1)`}],t,d,'cubic-bezier(.2,.8,.3,1)');
const slap=(el,t,rot=0)=>A(el,[{opacity:0,transform:`rotate(${rot}deg) scale(2.6)`},{opacity:1,transform:`rotate(${rot}deg) scale(.95)`,offset:.7},{opacity:1,transform:`rotate(${rot}deg) scale(1)`}],t,.35,'ease-out');
const tapeOn=(el,t)=>A(el,[{opacity:0,transform:el.style.transform+' scaleX(.2)'},{opacity:1,transform:el.style.transform+' scaleX(1)'}],t,.25,E.out);
// stop-motion "boil": tiny jitters at 12fps
function boil(el,t0,t1,amp=2,rot=.6,base=''){const n=6,kf=[];for(let i=0;i<n;i++){const a=Math.sin(i*12.9+amp)*amp,b=Math.cos(i*7.3)*amp,r=Math.sin(i*3.1)*rot;kf.push({transform:`${base} translate(${a}px,${b}px) rotate(${r}deg)`});}
 const d=0.5;A(el,kf,t0,d,'steps(6,end)','none',{iterations:Math.max(1,Math.floor((t1-t0)/d)),composite:'add'});}
// hand-drawn svg path draw-on
function draw(par,d,{x=0,y=0,w=200,h=200,c='#e8452c',sw=7,t=0,dur=.6}={}){const s=add(par,`<svg class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
 const p=s.querySelector('path');const L=p.getTotalLength();p.style.strokeDasharray=L;A(p,[{strokeDashoffset:L},{strokeDashoffset:0}],t,dur,'ease-in-out');return s;}
const fadeTo=(el,t,kf,d=.4)=>A(el,kf,t,d,E.io,'forwards');

A(document.getElementById('grain'),[{transform:'translate(0,0)'},{transform:'translate(-12px,8px)'},{transform:'translate(8px,-6px)'},{transform:'translate(0,0)'}],0,.33,'steps(4)','none',{iterations:Math.ceil(TL.total/.33)});
A(document.getElementById('sheet'),[{opacity:0,transform:'translateY(1400px) rotate(6deg)'},{opacity:1,transform:'translateY(0) rotate(-.6deg)'}],0,.7,E.out);
A(document.getElementById('hud'),[{opacity:0,transform:'translateY(-50px)'},{opacity:1,transform:'none'}],.3,.5,E.back);

// timings
const lines=TL.lines,sc={},order=[];
lines.forEach(l=>{if(!sc[l.scene]){sc[l.scene]={lines:[]};order.push(l.scene)}sc[l.scene].lines.push(l)});
order.forEach((k,i)=>sc[k].start=i?sc[k].lines[0].start-.45:0);
order.forEach((k,i)=>sc[k].end=i<order.length-1?sc[order[i+1]].start:TL.total);
const L=(s,i)=>s.lines[i].start, Le=(s,i)=>s.lines[i].end;
const S=document.getElementById('scenes'),RIP=document.getElementById('rip');
function mk(k){const s=sc[k];s.el=add(S,`<div class="scene"></div>`);
 if(s.start>0){ // torn-paper wipe: sheet of paper sweeps across, scene swaps under it
  A(RIP,[{transform:'translateX(0) rotate(0)'},{transform:'translateX(1150px) rotate(-2deg)',offset:.5},{transform:'translateX(2500px) rotate(-4deg)'}],s.start-.2,.62,'cubic-bezier(.7,0,.3,1)','none');
  A(s.el,[{opacity:0},{opacity:1}],s.start+.1,.01,'linear');
 } else A(s.el,[{opacity:0},{opacity:1}],0,.01,'linear');
 if(k!=='follow')A(s.el,[{opacity:1},{opacity:0}],s.end+.1,.01,'linear','forwards');
 return s;}
function title(s,txt,{x=130,y=200,rot=-2,size=96,bg='#fffdf7'}={}){const t=add(s.el,`<div class="strip" style="left:${x}px;top:${y}px;font-size:${size}px;background:${bg};transform:rotate(${rot}deg)">${txt}</div>`);place(t,s.start+.15,rot);
 const tp=add(s.el,`<div class="tape" style="left:${x-30}px;top:${y-14}px;transform:rotate(-30deg)"></div>`);tapeOn(tp,s.start+.5);boil(t,s.start+.7,s.end,1.2,.3);return t;}
function bigNum(s,n,rot=-6){const e=add(s.el,`<div class="num" style="left:120px;top:330px;transform:rotate(${rot}deg)">${n}</div>`);place(e,s.start+.1,rot,.6,'translateX(-300px)');
 const tp=add(s.el,`<div class="tape" style="left:170px;top:318px;transform:rotate(8deg)"></div>`);tapeOn(tp,s.start+.55);boil(e,s.start+.7,s.end,1.5,.4);return e;}
function promptCard(s,txt,t,{y=640,h=380}={}){const c=add(s.el,`<div class="card" style="left:130px;top:${y}px;width:820px;min-height:${h}px;transform:rotate(1deg)"><div class="mono" style="font-size:22px;letter-spacing:3px;color:#8a7e70;margin-bottom:12px">PROMPT ✎ copy this</div><div class="ty mono" style="font-size:36px;line-height:54px;font-weight:700"></div></div>`);
 place(c,t-.15,1,.5,'translateY(200px)');
 const tp1=add(s.el,`<div class="tape" style="left:110px;top:${y-18}px;transform:rotate(-35deg)"></div>`),tp2=add(s.el,`<div class="tape" style="left:860px;top:${y-18}px;transform:rotate(30deg)"></div>`);tapeOn(tp1,t+.2);tapeOn(tp2,t+.3);
 const ty=c.querySelector('.ty');const chars=[...txt];const span=Math.min(3.2,(Le(s,1)-t)*.85);
 chars.forEach((ch,i)=>{const e=add(ty,`<span>${ch===' '?' ':ch}</span>`);A(e,[{opacity:0},{opacity:1}],t+.25+span*i/chars.length,.01,'linear');});
 return c;}
const mkTitle={};

/* HOOK */
(()=>{const s=mk('hook');
 const t1=add(s.el,`<div class="strip" style="left:110px;top:230px;font-size:150px;transform:rotate(-3deg)">Ee <span style="color:var(--red)">5</span></div>`);place(t1,.35,-3);
 const t2=add(s.el,`<div class="strip" style="left:300px;top:420px;font-size:150px;background:var(--yel);transform:rotate(2deg)">prompts</div>`);place(t2,.55,2);
 const t3=add(s.el,`<div class="strip hand" style="left:180px;top:610px;font-size:90px;letter-spacing:0;transform:rotate(-1.5deg)">save chesko!</div>`);place(t3,.8,-1.5);
 [t1,t2,t3].forEach(e=>boil(e,1.3,s.end,1.3,.35));
 const st=add(s.el,`<div class="stamp" style="left:620px;top:660px;transform:rotate(-12deg)">SAVE</div>`);slap(st,1.3,-12);
 // 5 sticky notes fan
 const cols=['--yel','--pink','--blu','--grn','--yel'];
 for(let i=0;i<5;i++){const x=130+i*165,r=(i-2)*6;const n=add(s.el,`<div class="note" style="left:${x}px;top:${880+Math.abs(i-2)*30}px;width:190px;height:190px;background:var(${cols[i]});font-size:96px;display:flex;align-items:center;justify-content:center;transform:rotate(${r}deg)">${i+1}</div>`);
  place(n,L(s,1)+.1+i*.13,r,.45,'translateY(500px)');boil(n,L(s,1)+.8,s.end,1.5,.5);}
 draw(s.el,'M20 150 C 120 40, 260 40, 330 120',{x:560,y:1110,w:360,h:170,c:'#1d1b19',sw:6,t:L(s,1)+1,dur:.5});
 const nb=add(s.el,`<div class="abs hand" style="left:600px;top:1320px;font-size:42px;transform:rotate(-4deg)">naa reels anni veetitho!</div>`);A(nb,[{opacity:0},{opacity:1}],L(s,1)+1.3,.3,E.io);
})();

/* PROMPT scenes */
const P=[
 {k:'p1',n:'01',t:'Reel prompt',txt:'"Ee reference style lo, kaani copy kakunda, 9:16 reel cheyyi"',bg:'var(--pink)',doodle:'phone'},
 {k:'p2',n:'02',t:'Captions',txt:'"Telugu script ki Tenglish captions ivvu, important word highlight cheyyi"',bg:'var(--blu)',doodle:'caption'},
 {k:'p3',n:'03',t:'Glass widget',txt:'"Dark background meeda glass card — blur, thin border, neon glow"',bg:'var(--grn)',doodle:'glass'},
 {k:'p4',n:'04',t:'Voice script',txt:'"Ee topic ki 45 sec Telugu script raayi — hook, points, follow"',bg:'var(--yel)',doodle:'wave'},
 {k:'p5',n:'05',t:'Secret prompt',txt:'"Start cheyyakamundu, doubts unte MCQs lo adugu"',bg:'var(--red)',doodle:'mcq'},
];
P.forEach((p,pi)=>{const s=mk(p.k);
 bigNum(s,p.n,pi%2?5:-6);
 const tt=add(s.el,`<div class="strip" style="left:470px;top:400px;font-size:84px;background:${p.bg};color:${p.k==='p5'?'#fff':'var(--ink)'};transform:rotate(${pi%2?-3:3}deg);max-width:520px">${p.t}</div>`);
 place(tt,L(s,0)+.15,pi%2?-3:3);boil(tt,L(s,0)+.8,s.end,1.2,.3);
 const c=promptCard(s,p.txt,L(s,1));
 // doodle area y ~1060-1400
 const t=L(s,1)+.6;const D=add(s.el,`<div class="abs" style="left:130px;top:1060px;width:820px;height:360px"></div>`);
 draw(D,'M80 20 C 40 90, 60 170, 150 210',{x:0,y:0,w:240,h:240,c:'#e8452c',sw:7,t:t,dur:.45});
 if(p.doodle==='phone'){
  draw(D,'M300 20 h150 a20 20 0 0 1 20 20 v240 a20 20 0 0 1 -20 20 h-150 a20 20 0 0 1 -20 -20 v-240 a20 20 0 0 1 20 -20 z',{x:0,y:20,w:520,h:340,c:'#1d1b19',sw:6,t:t+.3,dur:.8});
  const l=add(D,`<div class="abs hand" style="left:315px;top:140px;font-size:56px">9:16</div>`);A(l,[{opacity:0},{opacity:1}],t+1,.2,E.io);
  const x=add(D,`<div class="abs hand" style="left:540px;top:90px;font-size:46px;color:var(--red);transform:rotate(-6deg)">copy ✗<br>own style ✓</div>`);A(x,[{opacity:0},{opacity:1}],t+1.3,.2,E.io);
 }else if(p.doodle==='caption'){
  const cs=add(D,`<div class="abs" style="left:240px;top:110px;width:560px;padding:22px 28px;background:#fff;box-shadow:0 8px 14px rgba(60,35,10,.3);font-weight:800;font-size:46px;transform:rotate(-2deg)">Idi chala <span class="m" style="position:relative"><span style="position:relative;z-index:1">easy</span><i class="abs" style="left:-6px;right:-6px;top:38%;bottom:4%;background:var(--yel);transform-origin:left"></i></span> ga untundi</div>`);
  place(cs,t+.3,-2,.45,'translateY(120px)');A(cs.querySelector('i'),[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],t+1,.35,'ease-out');
  draw(D,'M600 230 q 40 30 90 -10',{x:0,y:0,w:760,h:300,c:'#e8452c',sw:6,t:t+1.3,dur:.3});
  const n=add(D,`<div class="abs hand" style="left:560px;top:250px;font-size:40px;color:var(--red)">highlight!</div>`);A(n,[{opacity:0},{opacity:1}],t+1.5,.2,E.io);
 }else if(p.doodle==='glass'){
  const g=add(D,`<div class="abs" style="left:260px;top:40px;width:420px;height:250px;border-radius:30px;background:#1b1530;overflow:hidden;box-shadow:0 10px 20px rgba(0,0,0,.35);transform:rotate(-2deg)"><div class="abs" style="left:40px;top:40px;width:150px;height:150px;border-radius:50%;background:#5eead4;filter:blur(18px)"></div><div class="abs" style="left:230px;top:90px;width:160px;height:160px;border-radius:50%;background:#f472b6;filter:blur(18px)"></div><div class="abs" style="inset:30px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.06));border:2px solid rgba(255,255,255,.6);box-shadow:0 0 30px rgba(94,234,212,.7)"></div><div class="abs" style="left:60px;top:70px;color:#fff;font-weight:900;font-size:40px">Glass ✦</div></div>`);
  place(g,t+.3,-2,.5,'translateY(150px)');
  ['blur','border','glow'].forEach((w,i)=>{const e=add(D,`<div class="abs hand" style="left:${700}px;top:${40+i*80}px;font-size:40px">✓ ${w}</div>`);A(e,[{opacity:0,transform:'translateX(30px)'},{opacity:1,transform:'none'}],t+.9+i*.3,.3,E.out);});
 }else if(p.doodle==='wave'){
  draw(D,'M260 150 q 20 -90 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0',{x:0,y:0,w:720,h:300,c:'#1d1b19',sw:6,t:t+.3,dur:.9});
  draw(D,'M640 150 m -70 0 a 70 60 0 1 0 140 0 a 70 60 0 1 0 -140 0',{x:0,y:0,w:820,h:300,c:'#e8452c',sw:6,t:t+1.1,dur:.4});
  const n=add(D,`<div class="abs hand" style="left:600px;top:120px;font-size:50px;color:var(--red)">45s</div>`);A(n,[{opacity:0},{opacity:1}],t+1.4,.2,E.io);
  ['hook','points','follow'].forEach((w,i)=>{const e=add(D,`<div class="note" style="left:${260+i*170}px;top:230px;width:150px;padding:14px;font-size:30px;text-align:center;background:var(${['--pink','--blu','--grn'][i]});transform:rotate(${(i-1)*5}deg)">${w}</div>`);place(e,t+1.5+i*.15,(i-1)*5,.4,'translateY(120px)');});
 }else if(p.doodle==='mcq'){
  ['A · topic?','B · voice?','C · length?'].forEach((q,i)=>{const e=add(D,`<div class="abs hand" style="left:270px;top:${20+i*90}px;font-size:46px;display:flex;align-items:center;gap:20px"><span style="width:56px;height:56px;border:5px solid var(--ink);border-radius:8px;display:inline-block"></span>${q}</div>`);A(e,[{opacity:0,transform:'translateX(40px)'},{opacity:1,transform:'none'}],t+.3+i*.25,.3,E.out);
   draw(D,'M 8 30 l 16 18 l 30 -40',{x:274,y:20+i*90,w:70,h:60,c:'#e8452c',sw:7,t:t+1.2+i*.25,dur:.25});});
  const st=add(s.el,`<div class="stamp" style="left:480px;top:900px;transform:rotate(-7deg);font-size:56px;white-space:nowrap;background:rgba(255,253,247,.6)">GAME CHANGER</div>`);slap(st,L(s,2)+.15,-8);
 }
 boil(D,t+1.5,s.end,1,.2);
});

/* CTA */
(()=>{const s=mk('cta');
 const tt=add(s.el,`<div class="strip" style="left:120px;top:220px;font-size:110px;transform:rotate(-2deg)">Ye prompt <span style="color:var(--red)">best?</span></div>`);place(tt,s.start+.15,-2);boil(tt,s.start+.8,s.end,1.2,.3);
 const cols=['--yel','--pink','--blu','--grn','--yel'];const ns=[];
 for(let i=0;i<5;i++){const x=150+(i%3)*270,y=470+Math.floor(i/3)*290,r=[-5,3,-2,4,-4][i];

/* CAPTIONS — karaoke with marker highlight */
const CB=document.getElementById('capbar');
A(CB,[{opacity:0,transform:'translateY(300px) rotate(-6deg)'},{opacity:1,transform:'translateY(0) rotate(-1deg)'}],.4,.6,E.out);
lines.forEach((l,idx)=>{
 const ws=l.cap.replace(/\*([^*]+)\*/g,(m,g)=>g.split(' ').map(w=>'§'+w).join(' ')).split(' ');
 const plain=l.cap.replace(/\*/g,'');const fs=plain.length>62?44:plain.length>46?50:56;const el=add(CB,`<div class="cap" style="font-size:${fs}px"></div>`);const dur=(l.end-l.start)*.92;
 ws.forEach((w,i)=>{const hl=w.startsWith('§');const e=add(el,`<span class="w">${hl?'<i class="mk"></i>':''}<span class="k">${w.replace('§','')}</span></span>`);
  const t=l.start+dur*i/ws.length;A(e,[{opacity:.25},{opacity:1}],t,.1,'linear');
  if(hl)A(e.querySelector('.mk'),[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],t,.28,'ease-out');});
 const nxt=idx<lines.length-1?lines[idx+1].start:TL.total;
 A(el,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],l.start-.15,.15,'steps(3)');
 A(el,[{opacity:1},{opacity:0}],Math.min(nxt-.15,l.end+.7),.12,'linear','forwards');
});
window.seek=t=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000});
seek(0);window.READY=true;
