<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root{--sel:#0d99ff;--pu:#9747ff;--gr:#14ae5c;--rd:#f24822;--yl:#ffcd29;--ink:#1e1e1e;--mu:#757575;--cv:#f0f0f3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cv);font-family:'Inter',sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden}
#cam{position:absolute;left:0;top:0;width:4000px;height:4400px;transform-origin:0 0}
#dots{display:none}
#soft{position:absolute;inset:0;background:linear-gradient(165deg,#f6f2ff 0%,#eef5ff 45%,#fff4ee 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.board{position:absolute;width:960px;height:1200px;opacity:0}
  .blabel{display:none;position:absolute;font-size:24px;font-weight:600;color:var(--mu);display:flex;align-items:center;gap:10px}
.blabel i{width:18px;height:18px;border:2.5px solid var(--mu);border-radius:3px}
.abs{position:absolute}
.mono{font-family:'JetBrains Mono',monospace}
.D{font-family:'Inter Display';font-weight:900;letter-spacing:-.035em;line-height:.92}
.card{position:absolute;border-radius:32px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.06),0 24px 48px rgba(30,30,60,.12)}
.grad1{background:linear-gradient(135deg,#9747ff,#0d99ff)}
.grad2{background:linear-gradient(135deg,#ff7262,#ffcd29)}
.grad3{background:linear-gradient(135deg,#14ae5c,#0acf83)}
.pill{position:absolute;display:inline-flex;align-items:center;gap:12px;padding:16px 28px;border-radius:999px;font-family:'Inter Display';font-weight:800;font-size:34px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08),0 12px 26px rgba(30,30,60,.12);white-space:nowrap}
/* design-tool overlays */
.selbox{position:absolute;border:3px solid var(--sel);pointer-events:none}
.selbox b{position:absolute;width:18px;height:18px;background:#fff;border:3px solid var(--sel);border-radius:3px}
.selbox .tag{position:absolute;left:-3px;top:-44px;background:var(--sel);color:#fff;font-size:20px;font-weight:600;padding:6px 12px;border-radius:6px 6px 6px 0;white-space:nowrap}
.selbox .dim{position:absolute;left:50%;bottom:-44px;transform:translateX(-50%);background:var(--sel);color:#fff;font-size:18px;font-weight:600;padding:5px 10px;border-radius:6px;white-space:nowrap}
.cursor{display:none}
.cursor .nm{position:absolute;left:30px;top:30px;padding:6px 14px;border-radius:0 12px 12px 12px;color:#fff;font-size:22px;font-weight:700;white-space:nowrap}
.measure{position:absolute;pointer-events:none}
#tool{display:none;position:absolute;left:0;right:0;top:0;height:120px;background:#2c2c2c;display:flex;align-items:center;justify-content:space-between;padding:30px 36px 0;z-index:50;color:#fff}
#tool .tools{display:flex;gap:8px}
#tool .tools span{width:62px;height:62px;border-radius:12px;display:flex;align-items:center;justify-content:center}
#tool .fn{font-size:24px;font-weight:600;color:#e6e6e6}
#tool .fn em{font-style:normal;color:#9a9a9a;margin-left:10px;font-weight:500}
#tool .av{display:flex;align-items:center;gap:-8px}
#tool .av i{width:48px;height:48px;border-radius:50%;border:3px solid #2c2c2c;margin-left:-10px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:20px}
#tool .zoom{font-size:22px;color:#cfcfcf;margin-left:16px}
#capbar{position:absolute;left:60px;right:60px;top:1500px;min-height:220px;background:#fff;border-radius:20px;padding:36px 42px;z-index:45;box-shadow:0 2px 6px rgba(0,0,0,.06),0 24px 60px rgba(30,30,60,.16)}
#capbar .tg{position:absolute;left:40px;top:-20px;background:linear-gradient(90deg,#9747ff,#0d99ff);color:#fff;font-family:'JetBrains Mono';font-size:18px;font-weight:800;letter-spacing:2px;padding:6px 16px;border-radius:999px}
#capbar b{display:none}
#capbar b{position:absolute;width:18px;height:18px;background:#fff;border:3px solid var(--sel);border-radius:3px}
.cap{position:absolute;left:42px;right:42px;top:36px;font-family:'Inter Display';font-weight:900;font-size:58px;line-height:1.18;letter-spacing:-1px;opacity:0}
.cap .w{display:inline-block;margin-right:15px;opacity:.25}
.cap .hl{color:#fff;padding:0 12px;border-radius:12px;background:linear-gradient(90deg,#9747ff,#0d99ff)}
svg{overflow:visible}
#tool,.blabel,.cursor,.selbox{display:none!important}
</style></head>
<body><div id="stage">
<div id="soft"><div class="blob" style="left:-150px;top:200px;width:600px;height:600px;background:#c9b6ff"></div><div class="blob" style="left:600px;top:700px;width:560px;height:560px;background:#a9d8ff"></div><div class="blob" style="left:100px;top:1300px;width:520px;height:520px;background:#ffd0bd"></div></div>
<div id="cam"><div id="dots"></div><div id="boards"></div></div>
<div id="tool"><div class="tools" id="tools"></div><div class="fn">voice-tricks.reel<em>/ Dev Inventor</em></div><div style="display:flex;align-items:center"><div class="av"><i style="background:#9747ff">D</i><i style="background:#14ae5c">Y</i><i style="background:#ff7262">+3</i></div><span class="zoom" id="zoom"></span></div></div>
<div id="brand" style="position:absolute;left:60px;right:60px;top:80px;display:flex;justify-content:space-between;align-items:center;z-index:30"><div style="padding:14px 26px;border-radius:999px;background:#fff;box-shadow:0 10px 30px rgba(30,30,60,.12);font-family:'Inter Display';font-weight:900;font-size:30px">Dev Inventor <span style="background:linear-gradient(90deg,#9747ff,#0d99ff);-webkit-background-clip:text;color:transparent">✦</span></div><div style="padding:12px 22px;border-radius:999px;background:linear-gradient(90deg,#9747ff,#0d99ff);color:#fff;font-family:'JetBrains Mono';font-weight:800;font-size:20px;letter-spacing:3px">CREATOR TIPS</div></div>
<div id="fx"></div>
<div id="capbar"><div class="tg">TENGLISH CC</div><b style="left:-20px;top:-20px"></b><b style="right:-20px;top:-20px"></b><b style="left:-20px;bottom:-20px"></b><b style="right:-20px;bottom:-20px"></b></div>
</div>
<script>
const TL=__TIMELINE__;const NAME='Dev Inventor';
const E={out:'cubic-bezier(.16,1,.3,1)',spring:'cubic-bezier(.34,1.6,.5,1)',back:'cubic-bezier(.34,1.56,.64,1)',io:'cubic-bezier(.65,0,.35,1)'};
const A=(el,kf,st,du,ea=E.out,fill='both',x={})=>el.animate(kf,Object.assign({delay:st*1000,duration:du*1000,fill,easing:ea},x));
const H=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const add=(p,h)=>{const e=H(h);p.appendChild(e);return e};
const fadeTo=(el,t,kf,d=.3)=>A(el,kf,t,d,E.io,'forwards');
const T=TL.total;
const pop=(el,t,d=.5,base='')=>A(el,[{opacity:0,transform:`${base} scale(.4)`},{opacity:1,transform:`${base} scale(1)`}],t,d,E.back);
const rise=(el,t,d=.5,dy=50)=>A(el,[{opacity:0,transform:`translateY(${dy}px)`},{opacity:1,transform:'none'}],t,d,E.out);
function typeIn(el,txt,t,span){const chars=[...txt];chars.forEach((ch,i)=>{const e=add(el,`<span>${ch===' '?' ':ch}</span>`);A(e,[{opacity:0},{opacity:1}],t+span*i/chars.length,.01,'linear');});}
const check=(c,sz=40)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function draw(par,inner,{x,y,w,h,t,dur=.8,stroke='#1e1e1e',sw=6}){const s=add(par,`<svg class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px" viewBox="0 0 ${w} ${h}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`);
 s.querySelectorAll('[data-d]').forEach((p,i,arr)=>{const L=p.getTotalLength();p.style.strokeDasharray=L;A(p,[{strokeDashoffset:L},{strokeDashoffset:0}],t+i*(dur*.5)/Math.max(1,arr.length),dur*.7,'ease-in-out');});return s;}
// selection box that snaps around an element area (board coords)
function select(){return null;}
function _selectOld(par,{x,y,w,h,t,d=1.6,tag='',dim=''}){const s=add(par,`<div class="selbox" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><b style="left:-11px;top:-11px"></b><b style="right:-11px;top:-11px"></b><b style="left:-11px;bottom:-11px"></b><b style="right:-11px;bottom:-11px"></b>${tag?`<div class="tag">${tag}</div>`:''}${dim?`<div class="dim">${dim}</div>`:''}</div>`);
 A(s,[{opacity:0,transform:'scale(1.08)'},{opacity:1,transform:'scale(1)',offset:.12},{opacity:1,offset:.88},{opacity:0}],t,d,E.out);return s;}
// red distance measurement (design-tool style)
function measure(par,{x1,y1,x2,y2,label,t}){const horiz=Math.abs(y2-y1)<Math.abs(x2-x1);const w=Math.max(Math.abs(x2-x1),4),h=Math.max(Math.abs(y2-y1),4);
 const m=add(par,`<div class="measure" style="left:${Math.min(x1,x2)}px;top:${Math.min(y1,y2)}px;width:${w}px;height:${h}px"><div class="abs" style="${horiz?`left:0;right:0;top:50%;height:3px`:`top:0;bottom:0;left:50%;width:3px`};background:#f24822"></div><div class="abs" style="${horiz?'left:50%;top:-46px;transform:translateX(-50%)':'top:50%;left:20px;transform:translateY(-50%)'};background:#f24822;color:#fff;font-size:22px;font-weight:700;padding:5px 12px;border-radius:6px;white-space:nowrap">${label}</div></div>`);
 A(m.firstChild,[{transform:horiz?'scaleX(0)':'scaleY(0)'},{transform:'none'}],t,.5,E.io);A(m.lastChild,[{opacity:0},{opacity:1}],t+.4,.2,E.io);return m;}

// toolbar icons
const TO=document.getElementById('tools');
const icons={move:'<path d="M5 3l13 7-6 1.5L9 18z" fill="#fff"/>',frame:'<path d="M7 3v18M17 3v18M3 7h18M3 17h18" stroke="#fff" stroke-width="2"/>',pen:'<path d="M4 20l4-1L19 8l-3-3L5 16z M14 7l3 3" stroke="#fff" stroke-width="2" fill="none"/>',text:'<path d="M5 5h14M12 5v14" stroke="#fff" stroke-width="2.4"/>',hand:'<path d="M8 12V6a1.5 1.5 0 0 1 3 0v5V4.5a1.5 1.5 0 0 1 3 0V11V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-12 0v-3a1.5 1.5 0 0 1 3 0" stroke="#fff" stroke-width="1.8" fill="none"/>'};
const toolEls={};Object.entries(icons).forEach(([k,v])=>{toolEls[k]=add(TO,`<span><svg width="34" height="34" viewBox="0 0 24 24">${v}</svg></span>`);});
function activeTool(k,t){A(toolEls[k],[{background:'transparent'},{background:'#0d99ff'}],t,.15,'linear','forwards');Object.keys(toolEls).forEach(o=>{if(o!==k)A(toolEls[o],[{background:'#0d99ff'},{background:'transparent'}],t,.15,'linear','forwards');});}

// timings
const lines=TL.lines,sc={},order=[];
lines.forEach(l=>{if(!sc[l.scene]){sc[l.scene]={lines:[]};order.push(l.scene)}sc[l.scene].lines.push(l)});
order.forEach((k,i)=>sc[k].start=i?sc[k].lines[0].start-.5:0);
order.forEach((k,i)=>sc[k].end=i<order.length-1?sc[order[i+1]].start:TL.total);
const L=(s,i)=>s.lines[i].start, Le=(s,i)=>s.lines[i].end;

/* ===== canvas + camera: each scene is an artboard ===== */
const BW=960,BH=1200,GX=1240,GY=1520;
const layout={hook:[0,0],t1:[0,0],t2:[0,0],t3:[0,0],bonus:[0,0],cta:[0,0],follow:[0,0]};
const titles={hook:'01 · Hook',t1:'02 · Silent room',t2:'03 · Distance',t3:'04 · Pause',bonus:'05 · Bonus',cta:'06 · Save & share',follow:'07 · Follow'};
const BD=document.getElementById('boards'),CAM=document.getElementById('cam');
const boardPos=k=>{const [c,r]=layout[k];return [200+c*GX,240+r*GY];};
const FX=200,FY=250; // where the focused board's top-left sits on screen
const camAt=(k,s=1)=>{const [bx,by]=boardPos(k);const cx=bx+BW/2,cy=by+BH/2;return `translate(${540-s*cx}px,${(FY+BH/2)-s*cy}px) scale(${s})`;};
order.forEach(k=>{const [x,y]=boardPos(k);add(BD,`<div class="blabel" style="left:${x}px;top:${y-44}px"><i></i>${titles[k]}</div>`);sc[k].b=add(BD,`<div class="board" style="left:${x}px;top:${y}px"></div>`);});
// camera path: hold on each board, zoom out + pan between them
(function(){const kf=[];let prev=null;const tot=T;
 order.forEach((k,i)=>{const s=sc[k];const st=i?s.start-.15:0;
  if(prev){const ps=sc[prev];const [ax,ay]=boardPos(prev),[bx,by]=boardPos(k);const mx=(ax+bx)/2+BW/2,my=(ay+by)/2+BH/2;const z=1;
   kf.push({offset:Math.max(0,(st-.55))/tot,transform:camAt(prev)});
   kf.push({offset:Math.max(0,(st-.28))/tot,transform:`translate(${540-z*mx}px,${(FY+BH/2)-z*my}px) scale(${z})`,easing:'cubic-bezier(.4,0,.2,1)'});
   kf.push({offset:Math.min(1,(st+.05)/tot),transform:camAt(k)});}
  else kf.push({offset:0,transform:camAt(k,1)}),kf.push({offset:.6/tot,transform:camAt(k)});
  prev=k;});
 kf.push({offset:1,transform:camAt(prev)});
 kf.sort((a,b)=>a.offset-b.offset);for(let i=1;i<kf.length;i++)if(kf[i].offset<=kf[i-1].offset)kf[i].offset=Math.min(1,kf[i-1].offset+1e-4);
 kf.forEach(f=>{if(!f.easing)f.easing='cubic-bezier(.65,0,.35,1)';});
 A(CAM,kf,0,tot,'linear','both');})();
A(document.getElementById('brand'),[{opacity:0,transform:'translateY(-30px)'},{opacity:1,transform:'none'}],.2,.6,E.out);
// clean scene transitions: each board slides/scales in, then out
order.forEach((k,i)=>{const s=sc[k],b=s.b;
 A(b,[{opacity:0,transform:'translateY(70px) scale(.97)',filter:'blur(8px)'},{opacity:1,transform:'none',filter:'blur(0)'}],i?s.start:0,.55,E.out);
 if(i<order.length-1)A(b,[{opacity:1,transform:'none',filter:'blur(0)'},{opacity:0,transform:'translateY(-50px) scale(1.02)',filter:'blur(8px)'}],s.end-.3,.3,E.io,'forwards');});
// zoom % readout
const ZM=document.getElementById('zoom');ZM.style.position='relative';ZM.style.display='inline-block';ZM.style.width='80px';ZM.style.height='26px';
order.forEach((k,i)=>{const s=sc[k];if(i){const a=add(ZM,`<span class="abs" style="left:0;top:0">42%</span>`);A(a,[{opacity:0},{opacity:1}],s.start-.4,.01,'linear');A(a,[{opacity:1},{opacity:0}],s.start,.01,'linear','forwards');}
 const b=add(ZM,`<span class="abs" style="left:0;top:0">100%</span>`);A(b,[{opacity:0},{opacity:1}],i?s.start:0,.01,'linear');if(i<order.length-1)A(b,[{opacity:1},{opacity:0}],sc[order[i+1]].start-.4,.01,'linear','forwards');});
// multiplayer cursors (screen space)
const FXL=document.getElementById('fx');
function cursorEl(name,col){return add(FXL,`<div class="cursor"><svg width="38" height="38" viewBox="0 0 24 24"><path d="M4 2l15 9-7 1.6L8.5 20z" fill="${col}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><div class="nm" style="background:${col}">${name}</div></div>`);}
const C1=cursorEl('Dev','#9747ff'),C2=cursorEl('Design','#14ae5c');
function cursorPath(c,pts){const kf=pts.map(([t,x,y])=>({offset:t/T,transform:`translate(${x}px,${y}px)`}));kf.unshift({offset:0,transform:`translate(${pts[0][1]}px,${pts[0][2]}px)`});kf.push({offset:1,transform:`translate(${pts[pts.length-1][1]}px,${pts[pts.length-1][2]}px)`});
 for(let i=1;i<kf.length;i++)if(kf[i].offset<=kf[i-1].offset)kf[i].offset=Math.min(1,kf[i-1].offset+1e-4);kf.forEach(f=>f.easing='cubic-bezier(.45,0,.25,1)');A(c,kf,0,T,'linear','both');}
const sx=x=>FX+x+60,sy=y=>FY+y; // board coords → screen (board at x=60 on screen)

/* HOOK */
(()=>{const s=sc.hook,B=s.b;activeTool('text',.2);
 const t1=add(B,`<div class="abs D" style="left:70px;top:90px;font-size:120px;width:820px">Voice <span style="background:linear-gradient(90deg,#9747ff,#0d99ff);-webkit-background-clip:text;color:transparent">clear</span><br>ga raavatleda?</div>`);rise(t1,.6);
 select(B,{x:60,y:80,w:840,h:240,t:.9,d:1.6,tag:'Text · Inter Black',dim:'840 × 240'});
 // noisy waveform component
 const wv=add(B,`<div class="card" style="left:70px;top:400px;width:820px;height:260px;padding:30px"><div class="mono" style="font-size:20px;color:#757575">YOUR VOICE NOW · NOISY</div><div class="bars" style="display:flex;align-items:center;gap:8px;height:170px;margin-top:10px"></div></div>`);rise(wv,L(s,0)+.3);
 const bars=wv.querySelector('.bars');for(let i=0;i<46;i++){const b=add(bars,`<div style="flex:1;border-radius:4px;background:#f24822;height:${20+Math.abs(Math.sin(i*2.7)*Math.cos(i*1.1))*150}px"></div>`);const kf=[];for(let k=0;k<=6;k++)kf.push({transform:`scaleY(${.3+Math.abs(Math.sin(i*1.9+k*2.7))})`});A(b,kf,L(s,0)+.5,.6,'linear','none',{iterations:12});}
 const t2=L(s,1);
 const mic=add(B,`<div class="card" style="left:70px;top:720px;width:400px;height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px"><svg width="140" height="140" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="#1e1e1e"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/></svg><div class="D" style="font-size:44px">Costly mic?</div><div class="abs" style="left:40px;right:40px;top:196px;height:8px;border-radius:4px;background:#f24822;transform:rotate(-20deg)" id="strike"></div></div>`);
 rise(mic,t2);A(mic.querySelector('#strike'),[{transform:'rotate(-20deg) scaleX(0)'},{transform:'rotate(-20deg) scaleX(1)'}],t2+.7,.3,E.io);
 const three=add(B,`<div class="card grad1" style="left:500px;top:720px;width:390px;height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff"><div class="D" style="font-size:220px">3</div><div class="D" style="font-size:56px">tricks chaalu</div></div>`);pop(three,t2+1.1,.55);
})();

/* T1 silent room */
(()=>{const s=sc.t1,B=s.b;
 const h=add(B,`<div class="abs" style="left:70px;top:70px"><div class="mono" style="font-size:24px;color:#9747ff;font-weight:700">TRICK 01</div><div class="D" style="font-size:110px;margin-top:10px">Silent room</div></div>`);rise(h,s.start+.4);
 const room=add(B,`<div class="card" style="left:70px;top:330px;width:820px;height:470px;overflow:hidden;background:#f7f5ff"></div>`);rise(room,L(s,0));
 // fan
 const fan=add(room,`<div class="abs" style="left:320px;top:20px;width:180px;height:180px"><svg width="180" height="180" viewBox="0 0 100 100"><g class="bl"><ellipse cx="50" cy="28" rx="10" ry="22" fill="#b9a6ff"/><ellipse cx="50" cy="72" rx="10" ry="22" fill="#b9a6ff"/><ellipse cx="28" cy="50" rx="22" ry="10" fill="#b9a6ff"/><ellipse cx="72" cy="50" rx="22" ry="10" fill="#b9a6ff"/></g><circle cx="50" cy="50" r="8" fill="#6b4fd8"/></svg></div>`);
 const bl=fan.querySelector('.bl');bl.style.transformOrigin='50px 50px';A(bl,[{transform:'rotate(0)'},{transform:'rotate(360deg)'}],0,.35,'linear','none',{iterations:Math.ceil((L(s,1)+1.2)/.35)});
 // AC
 add(room,`<div class="abs" style="left:560px;top:40px;width:220px;height:80px;border-radius:16px;background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.08)"><div style="margin:52px 20px 0;height:8px;border-radius:4px;background:#d9d9e3"></div></div>`);
 // curtains + sofa (soft things)
 add(room,`<div class="abs" style="left:30px;top:30px;width:120px;height:300px;border-radius:12px;background:repeating-linear-gradient(90deg,#ff9e8a 0 20px,#ff8a73 20px 40px)"></div>`);
 add(room,`<div class="abs" style="left:200px;top:300px;width:420px;height:130px;border-radius:40px 40px 20px 20px;background:#9fd4ff"></div>`);
 // echo rings
 for(let i=0;i<3;i++){const r=add(room,`<div class="abs" style="left:610px;top:250px;width:120px;height:120px;border-radius:50%;border:5px solid #f24822"></div>`);A(r,[{opacity:.9,transform:'scale(.3)'},{opacity:0,transform:'scale(2.6)'}],L(s,0)+.2+i*.4,1.2,E.out,'none',{iterations:3});}
 // toggles
 const tg=(lbl,y,t)=>{const r=add(B,`<div class="card" style="left:70px;top:${y}px;width:400px;height:120px;display:flex;align-items:center;justify-content:space-between;padding:0 30px"><div class="D" style="font-size:44px">${lbl}</div><div class="sw" style="position:relative;width:110px;height:60px;border-radius:30px;background:#14ae5c"><div class="k" style="position:absolute;top:6px;left:56px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)"></div></div></div>`);rise(r,L(s,1)-.1);
