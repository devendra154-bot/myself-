<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root{--cy:#5eead4;--cy2:#22d3ee;--vi:#8b5cf6;--mg:#f472b6;--lm:#bef264;--tx:#eef2ff;--mu:#8b93ad}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05070d;font-family:'Inter',sans-serif;color:var(--tx)}
#stage{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(130px);opacity:.34}
.lines{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(90deg,#fff 1px,transparent 1px);background-size:180px 100%}
.scene{position:absolute;inset:0;opacity:0;perspective:1600px}
.abs{position:absolute}
.mono{font-family:'JetBrains Mono',monospace}
#hud{position:absolute;top:70px;left:70px;right:70px;display:flex;justify-content:space-between;align-items:center}
#brand{font-family:'JetBrains Mono';font-size:26px;letter-spacing:4px;color:#c7d2fe}
#brand b{color:var(--cy)}
#rec{display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono';font-size:24px;letter-spacing:3px;color:#fda4af}
#rec i{width:16px;height:16px;border-radius:50%;background:#fb7185;box-shadow:0 0 14px #fb7185}
.tag{position:absolute;left:80px;top:180px;font-family:'JetBrains Mono';font-size:26px;letter-spacing:6px;color:var(--cy)}
.ttl{position:absolute;left:80px;top:230px;width:930px;font-family:'Inter Display';font-weight:900;font-size:110px;line-height:.95;letter-spacing:-4px}
.ttl .ol{color:transparent;-webkit-text-stroke:3px var(--cy)}
.ttl .gr{background:linear-gradient(90deg,var(--cy),var(--mg));-webkit-background-clip:text;color:transparent}
.fp{position:absolute;border-radius:34px;background:linear-gradient(170deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.2);box-shadow:0 40px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28)}
.lbl{font-family:'JetBrains Mono';font-size:22px;letter-spacing:4px;color:var(--mu)}
.chip{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;border-radius:16px;font-family:'JetBrains Mono';font-weight:700;font-size:30px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22)}
/* light leaks / flares / particles */
#fx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.leak{position:absolute;width:1400px;height:900px;border-radius:50%;filter:blur(90px);opacity:0}
.flare{position:absolute;width:0;height:0;opacity:0}
.flare .core{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.9) 12%,rgba(150,240,255,.45) 35%,transparent 70%)}
.flare .streak{position:absolute;left:-700px;top:-5px;width:1400px;height:10px;border-radius:5px;background:linear-gradient(90deg,transparent,rgba(120,220,255,.65) 35%,#fff 50%,rgba(244,114,182,.65) 65%,transparent);filter:blur(2px)}
.flare .ring{position:absolute;border-radius:50%;border:3px solid rgba(160,230,255,.35)}
.pt{position:absolute;border-radius:50%;background:#fff}
#capbar{position:absolute;left:60px;right:60px;top:1470px;min-height:200px;border-radius:36px;background:rgba(8,12,24,.6);border:1.5px solid rgba(255,255,255,.14);box-shadow:0 30px 70px rgba(0,0,0,.5);padding:34px 44px}
#capbar .dot{position:absolute;left:44px;top:-22px;padding:6px 16px;border-radius:10px;background:var(--mg);color:#1a0612;font-family:'JetBrains Mono';font-size:20px;font-weight:700;letter-spacing:2px}
.cap{position:absolute;left:44px;right:44px;top:34px;font-weight:800;font-size:56px;line-height:1.25;letter-spacing:-.5px;opacity:0}
.cap .w{display:inline-block;opacity:.3;margin-right:14px}
.cap .hl{color:#04121a;padding:0 12px;border-radius:12px;background:linear-gradient(90deg,var(--cy),var(--cy2))}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6));pointer-events:none}
svg{overflow:visible}
</style></head>
<body><div id="stage">
<div id="aur"></div><div class="lines"></div>
<div id="hud"><div id="brand">DEV INVENTOR <b>✦</b> VOICE LAB</div><div id="rec"><i></i>VOICE AGENTS</div></div>
<div id="scenes"></div>
<div id="parts"></div>
<div id="capbar"><div class="dot">TENGLISH CC</div></div>
<div id="fx"></div>
<div class="vig"></div>
</div>
<script>
const TL=__TIMELINE__;
const NAME='Dev Inventor';
const E={out:'cubic-bezier(.16,1,.3,1)',back:'cubic-bezier(.34,1.56,.64,1)',io:'cubic-bezier(.65,0,.35,1)'};
const A=(el,kf,st,du,ea=E.out,fill='both',x={})=>el.animate(kf,Object.assign({delay:st*1000,duration:du*1000,fill,easing:ea},x));
const H=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const add=(p,h)=>{const e=H(h);p.appendChild(e);return e};
const fadeTo=(el,t,kf,d=.4)=>A(el,kf,t,d,E.io,'forwards');
const slideIn=(el,t,d=.7,dx=120)=>A(el,[{opacity:0,transform:`translateX(${dx}px)`,clipPath:'inset(0 0 0 100%)'},{opacity:1,transform:'none',clipPath:'inset(0 0 0 0%)'}],t,d,E.out);
const rise=(el,t,d=.6,dy=60,base='')=>A(el,[{opacity:0,transform:`${base} translateY(${dy}px)`},{opacity:1,transform:`${base} translateY(0)`}],t,d,E.out);
const pop=(el,t,d=.5,base='')=>A(el,[{opacity:0,transform:`${base} scale(.3)`},{opacity:1,transform:`${base} scale(1)`}],t,d,E.back);
const zoomIn=(el,t,d=.8)=>A(el,[{opacity:0,transform:'translateZ(-600px) scale(.6)',filter:'blur(14px)'},{opacity:1,transform:'none',filter:'blur(0)'}],t,d,E.out);
const check=(c,sz=40)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const mic=(c,sz=60)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="${c}"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`;
const lockSvg=(c,sz=110)=>`<svg width="${sz}" height="${sz*1.13}" viewBox="0 0 30 34"><path class="sh" d="M8 15V10a7 7 0 0 1 14 0v5" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/><rect x="4" y="15" width="22" height="17" rx="4" fill="${c}"/><circle cx="15" cy="23.5" r="2.5" fill="#05070d"/></svg>`;
function cursor(par,x,y){return add(par,`<div class="abs" style="left:${x}px;top:${y}px;width:56px;height:56px;z-index:9"><svg width="56" height="56" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" fill="#fff" stroke="#05070d" stroke-width="1.2" stroke-linejoin="round"/></svg></div>`);}
function wave(par,n,color,h=160,seed=1){const w=add(par,`<div style="display:flex;align-items:center;gap:6px;height:${h}px"></div>`);const bars=[];
 for(let i=0;i<n;i++){bars.push(add(w,`<div style="flex:1;min-width:6px;border-radius:4px;background:${color};height:${18+Math.abs(Math.sin(i*.8*seed)*Math.cos(i*.33))*(h-24)}px"></div>`));}return [w,bars];}
function animWave(bars,t0,dur){bars.forEach((b,i)=>{const kf=[];for(let k=0;k<=6;k++)kf.push({transform:`scaleY(${.25+Math.abs(Math.sin(i*1.7+k*2.3))*(k%2?1:.5)})`});A(b,kf,t0,.9,'ease-in-out','none',{iterations:Math.max(1,Math.ceil(dur/.9))});});}

// aurora
const aur=document.getElementById('aur');
[['#22d3ee',-200,100,800],['#8b5cf6',500,500,900],['#f472b6',-100,1100,700],['#0ea5e9',600,1400,700]].forEach((b,i)=>{
 const e=add(aur,`<div class="blob" style="background:${b[0]};left:${b[1]}px;top:${b[2]}px;width:${b[3]}px;height:${b[3]}px"></div>`);
 A(e,[{transform:'translate(0,0)'},{transform:`translate(${i%2?-180:200}px,${i<2?160:-140}px)`},{transform:`translate(${i%2?120:-100}px,${i<2?-80:90}px)`},{transform:'translate(0,0)'}],0,TL.total,'ease-in-out','none');});
A(document.getElementById('hud'),[{opacity:0,transform:'translateY(-40px)'},{opacity:1,transform:'none'}],.2,.7);
A(document.querySelector('#rec i'),[{opacity:1},{opacity:.25},{opacity:1}],0,1.2,'ease-in-out','none',{iterations:Math.ceil(TL.total/1.2)});

// particles (floating dust)
const PR=document.getElementById('parts');
for(let i=0;i<46;i++){const r=(Math.sin(i*12.9898)*43758.5453)%1,r2=(Math.sin(i*78.233)*12543.17)%1;const x=Math.abs(r)*1080,y=Math.abs(r2)*1920,s=2+Math.abs(r*r2)*7;
 const p=add(PR,`<div class="pt" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;opacity:${.15+Math.abs(r2)*.5};box-shadow:0 0 ${s*3}px ${['#5eead4','#f472b6','#fff','#8b5cf6'][i%4]}"></div>`);
 const dur=9+Math.abs(r)*10;A(p,[{transform:'translate(0,0)'},{transform:`translate(${(r-.0)*120}px,-${300+Math.abs(r2)*500}px)`}],-(i*.7),dur,'linear','none',{iterations:Math.ceil((TL.total+10)/dur)+1});}

// FX: light leak + lens flare
const FX=document.getElementById('fx');
function leak(t,color='#ff9a5a',from='left',d=1.6){const e=add(FX,`<div class="leak" style="background:radial-gradient(ellipse,${color},transparent 65%);top:${from==='left'?-100:900}px;left:-300px"></div>`);
 const x0=from==='left'?-1200:1100,x1=from==='left'?900:-1100;
 A(e,[{opacity:0,transform:`translateX(${x0}px) rotate(-15deg)`},{opacity:.85,offset:.45},{opacity:0,transform:`translateX(${x1}px) rotate(10deg)`}],t,d,E.io,'none');}
function flare(t,x,y,d=1.2,dx=500){const f=add(FX,`<div class="flare" style="left:${x}px;top:${y}px"><div class="streak"></div><div class="core"></div></div>`);
 [[60,140,.5],[-120,60,.35],[-260,200,.25]].forEach(([o,s,a])=>add(f,`<div class="ring" style="left:${o-s/2}px;top:${-s/2}px;width:${s}px;height:${s}px;opacity:${a}"></div>`));
 A(f,[{opacity:0,transform:'translateX(0) scale(.5)'},{opacity:1,transform:`translateX(${dx*.4}px) scale(1.1)`,offset:.35},{opacity:0,transform:`translateX(${dx}px) scale(.8)`}],t,d,E.io,'none');}

// scenes
const lines=TL.lines,sc={},order=[];
lines.forEach(l=>{if(!sc[l.scene]){sc[l.scene]={lines:[]};order.push(l.scene)}sc[l.scene].lines.push(l)});
order.forEach((k,i)=>sc[k].start=i?sc[k].lines[0].start-.4:0);
order.forEach((k,i)=>sc[k].end=i<order.length-1?sc[order[i+1]].start:TL.total);
const L=(s,i)=>s.lines[i].start, Le=(s,i)=>s.lines[i].end;
const S=document.getElementById('scenes');
const leakCols=['#ff9a5a','#f472b6','#5eead4','#fbbf24','#a78bfa'];
function mk(k,idx){const s=sc[k];s.el=add(S,`<div class="scene"></div>`);
 A(s.el,[{opacity:0,transform:'scale(1.08)',filter:'blur(10px)'},{opacity:1,transform:'scale(1)',filter:'blur(0)'}],s.start,.55,E.out);
 if(k!=='follow')A(s.el,[{opacity:1,transform:'scale(1)',filter:'blur(0)'},{opacity:0,transform:'scale(.94)',filter:'blur(12px)'}],s.end-.32,.32,E.io,'forwards');
 if(s.start>0)leak(s.start-.5,leakCols[idx%leakCols.length],idx%2?'right':'left',1.4);
 return s;}
function head(s,tag,html){const t=add(s.el,`<div class="tag">${tag}</div>`);slideIn(t,s.start+.1,.6,40);
 const h=add(s.el,`<div class="ttl">${html}</div>`);slideIn(h,s.start+.18,.8,80);return h;}
let si=0;

/* HOOK: locked card unlocks */
(()=>{const s=mk('hook',si++);head(s,'AS PROMISED','Voice <span class="gr">agent</span><br><span class="ol">reveal</span>');
 const c=add(s.el,`<div class="fp" style="left:190px;top:560px;width:700px;height:640px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px">${lockSvg('#f472b6',150)}<div style="font-family:'Inter Display';font-weight:900;font-size:80px;letter-spacing:-2px">VOICE AGENT</div><div class="mono rv" style="font-size:30px;color:var(--mu)">████ ███ ████</div></div>`);
 zoomIn(c,.3,.9);
 const un=L(s,0)+1.6;A(c.querySelector('.sh'),[{transform:'none'},{transform:'translate(7px,-6px) rotate(25deg)'}],un,.4,E.back,'forwards');
 A(c,[{boxShadow:'0 40px 90px rgba(0,0,0,.45)'},{boxShadow:'0 0 120px rgba(244,114,182,.8),0 40px 90px rgba(0,0,0,.45)'}],un,.5,E.io,'forwards');
 const rv=c.querySelector('.rv');A(rv,[{opacity:1},{opacity:0}],un+.1,.2,E.io,'forwards');
 const nw=add(c,`<div class="mono" style="position:absolute;bottom:150px;font-size:34px;color:var(--cy);opacity:0">UNLOCKED ✓</div>`);A(nw,[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],un+.2,.4,E.out);
 flare(un-.15,540,880,1.4,600);
})();

/* PROBLEM */
(()=>{const s=mk('problem',si++);head(s,'THE PROBLEM','Voice<br><span class="gr">baaleda?</span>');
 const m=add(s.el,`<div class="fp" style="left:340px;top:600px;width:400px;height:400px;border-radius:50%;display:flex;align-items:center;justify-content:center">${mic('#eef2ff',170)}</div>`);
 zoomIn(m,L(s,0)-.1,.7);
 A(m,[{transform:'scale(1) rotate(0)'},{transform:'scale(.72) rotate(-8deg)'}],L(s,0)+1.4,.8,E.back,'forwards');
 ['?','??','😶'.replace('😶','…')].forEach((q,i)=>{const b=add(s.el,`<div class="fp" style="left:${[220,700,640][i]}px;top:${[620,640,940][i]}px;padding:18px 30px;border-radius:30px;font-weight:900;font-size:60px;color:var(--mg)">${q}</div>`);
  pop(b,L(s,0)+.6+i*.4);A(b,[{transform:'translateY(0)'},{transform:'translateY(-22px)'},{transform:'translateY(0)'}],L(s,0)+1.2+i*.4,1.6,E.io,'none',{iterations:2});});
 const sg=add(s.el,`<div class="chip" style="position:absolute;left:300px;top:1110px;color:var(--mg);border-color:var(--mg)">record cheyyadaniki siggaa?</div>`);rise(sg,L(s,0)+1.9,.5,30);
})();

/* TWO */
(()=>{const s=mk('two',si++);head(s,'2 VOICE AGENTS','Ivi<br><span class="gr">rendu</span>');
 [['01','Microsoft','neural voice','#5eead4'],['02','ElevenLabs','AI voice + clone','#f472b6']].forEach(([n,a,b,c],i)=>{
  const e=add(s.el,`<div class="fp" style="left:${80+i*470}px;top:600px;width:450px;height:560px;padding:40px;border-color:${c};box-shadow:0 0 60px ${c}55,0 40px 90px rgba(0,0,0,.45)">
   <div style="font-family:'Inter Display';font-weight:900;font-size:120px;color:transparent;-webkit-text-stroke:3px ${c};line-height:1">${n}</div>
   <div style="font-weight:900;font-size:60px;margin-top:60px;letter-spacing:-1px">${a}</div><div class="mono" style="font-size:28px;color:var(--mu);margin-top:10px">${b}</div></div>`);
  A(e,[{opacity:0,transform:`translateX(${i?300:-300}px) rotateY(${i?-40:40}deg)`},{opacity:1,transform:'none'}],L(s,0)-.1+i*.25,.7,E.out);});
 flare(L(s,0)+.3,200,620,1.2,700);
})();

/* MICROSOFT */
(()=>{const s=mk('ms',si++);head(s,'AGENT 01','<span class="gr">Microsoft</span><br>neural voice');
 const chips=add(s.el,`<div class="abs" style="left:80px;top:540px;width:920px;display:flex;gap:20px"></div>`);
 [['♂','Mohan','male'],['♀','Shruti','female']].forEach(([g,n,t],i)=>{const e=add(chips,`<div class="fp" style="position:relative;flex:1;height:130px;display:flex;align-items:center;gap:22px;padding:0 30px"><div style="width:76px;height:76px;border-radius:50%;background:${i?'linear-gradient(135deg,#f472b6,#8b5cf6)':'linear-gradient(135deg,#5eead4,#22d3ee)'};display:flex;align-items:center;justify-content:center;font-size:40px;color:#05070d;font-weight:900">${g}</div><div><div style="font-weight:900;font-size:46px">${n}</div><div class="mono" style="font-size:22px;color:var(--mu)">Telugu · ${t}</div></div></div>`);
  pop(e,L(s,1)+.5+i*.9,.5);});
 const br=add(s.el,`<div class="fp" style="left:80px;top:700px;width:920px;height:250px;padding:0;overflow:hidden">
   <div style="height:58px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:12px;padding:0 24px"><i style="width:16px;height:16px;border-radius:50%;background:#fb7185"></i><i style="width:16px;height:16px;border-radius:50%;background:#fbbf24"></i><i style="width:16px;height:16px;border-radius:50%;background:#4ade80"></i><div class="mono" style="margin-left:20px;font-size:22px;color:var(--mu)">Edge browser</div></div>
   <div class="mono" style="display:flex;align-items:center;gap:18px;padding:40px 30px;font-size:32px"><span class="st">⋯ menu</span><span style="color:var(--mu)">→</span><span class="st">Read aloud</span><span style="color:var(--mu)">→</span><span class="st" style="color:var(--cy)">Telugu voice</span></div></div>`);
 slideIn(br,L(s,2)-.1);br.querySelectorAll('.st').forEach((e,i)=>A(e,[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],L(s,2)+.3+i*.35,.35,E.out));
 const fr=add(s.el,`<div class="abs" style="left:820px;top:670px;padding:12px 26px;border-radius:14px;background:var(--lm);color:#1a2e05;font-family:'Inter Display';font-weight:900;font-size:40px;transform:rotate(8deg);z-index:5;box-shadow:0 0 40px rgba(190,242,100,.6)">FREE</div>`);
 A(fr,[{opacity:0,transform:'rotate(8deg) scale(2.4)'},{opacity:1,transform:'rotate(8deg) scale(1)'}],L(s,2)+.1,.4,E.back);
 const wc=add(s.el,`<div class="fp" style="left:80px;top:990px;width:920px;height:260px;padding:26px 34px"><div style="display:flex;justify-content:space-between"><div class="lbl">🔊 LIVE DEMO</div><div class="mono who" style="position:relative;font-size:22px;width:200px;text-align:right"></div></div><div class="wv" style="margin-top:12px"></div></div>`);
 rise(wc,L(s,3)-.1);
 const [w,bars]=wave(wc.querySelector('.wv'),46,'linear-gradient(#5eead4,#8b5cf6)',160,1.3);
 const d0=L(s,4),d1=Le(s,4);animWave(bars,d0,d1-d0);
 const who=wc.querySelector('.who');const mo=add(who,`<span class="abs" style="right:0;color:var(--cy)">♂ MOHAN</span>`),sh=add(who,`<span class="abs" style="right:0;color:var(--mg)">♀ SHRUTI</span>`);
 const mid=d0+(d1-d0)*.42;A(mo,[{opacity:0},{opacity:1}],d0,.2,E.io);A(mo,[{opacity:1},{opacity:0}],mid,.2,E.io,'forwards');A(sh,[{opacity:0},{opacity:1}],mid,.2,E.io);
 A(wc,[{borderColor:'rgba(255,255,255,.2)'},{borderColor:'#5eead4'}],d0,.3,E.io,'forwards');
 flare(d0,150,1120,1.3,800);
 const used=add(s.el,`<div class="chip" style="position:absolute;left:80px;top:1290px;background:var(--cy);border-color:var(--cy);color:#04121a">${check('#04121a',30)} used in my last reel</div>`);pop(used,L(s,5)+.5);
})();

/* ELEVENLABS */
(()=>{const s=mk('el',si++);head(s,'AGENT 02','<span class="gr">Eleven</span><br>Labs');
 const em=add(s.el,`<div class="fp" style="left:80px;top:550px;width:920px;height:330px;padding:30px 40px"><div class="lbl">EMOTION</div></div>`);rise(em,L(s,1)-.1);
 [['happy','#fbbf24',.8],['calm','#5eead4',.45],['excited','#f472b6',.95]].forEach(([n,c,v],i)=>{const r=add(em,`<div style="margin-top:26px"><div class="mono" style="display:flex;justify-content:space-between;font-size:28px"><span>${n}</span><span style="color:${c}">${Math.round(v*100)}%</span></div><div style="position:relative;margin-top:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.12)"><div class="f" style="height:100%;width:0;border-radius:6px;background:${c};box-shadow:0 0 18px ${c}"></div></div></div>`);
  A(r.querySelector('.f'),[{width:'0%'},{width:`${v*100}%`}],L(s,1)+.3+i*.3,.8,E.out,'forwards');});
 const cl=add(s.el,`<div class="fp" style="left:80px;top:910px;width:920px;height:290px;padding:26px 34px"><div class="lbl">VOICE CLONE</div><div class="a" style="margin-top:10px"></div><div class="b" style="margin-top:-6px"></div></div>`);rise(cl,L(s,2)-.1);
 const [wa,ba]=wave(cl.querySelector('.a'),46,'#eef2ff',100,.9);const [wb,bb]=wave(cl.querySelector('.b'),46,'linear-gradient(#f472b6,#8b5cf6)',100,.9);
 bb.forEach((b,i)=>A(b,[{opacity:0,transform:'translateY(-90px)'},{opacity:1,transform:'none'}],L(s,2)+.6+i*.02,.4,E.out));
 const tw=add(cl,`<div class="mono" style="position:absolute;right:34px;top:26px;font-size:22px;color:var(--mg)">YOU → TWIN</div>`);A(tw,[{opacity:0},{opacity:1}],L(s,2)+1.2,.3,E.io);
