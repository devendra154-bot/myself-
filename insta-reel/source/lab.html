<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root{--cy:#5eead4;--cy2:#22d3ee;--vi:#8b5cf6;--mg:#f472b6;--lm:#bef264;--rd:#fb7185;--tx:#eef2ff;--mu:#7c86a2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05070d;font-family:'Inter',sans-serif;color:var(--tx)}
#stage{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(130px);opacity:.32}
.noise{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:6px 6px}
.lines{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(90deg,#fff 1px,transparent 1px);background-size:180px 100%}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.mono{font-family:'JetBrains Mono',monospace}
/* HUD */
#hud{position:absolute;top:70px;left:70px;right:70px;height:60px;display:flex;align-items:center;justify-content:space-between}
#brand{font-family:'JetBrains Mono';font-size:26px;letter-spacing:4px;color:#c7d2fe}
#brand b{color:var(--cy)}
#segs{display:flex;gap:10px}
#segs div{width:52px;height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
#segs div i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--cy2))}
/* titles */
.chap{position:absolute;right:50px;top:150px;font-family:'Inter Display';font-weight:900;font-size:300px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(94,234,212,.13);letter-spacing:-12px;top:520px !important}
.ttl{position:absolute;left:80px;top:230px;width:920px;font-family:'Inter Display';font-weight:900;font-size:112px;line-height:.95;letter-spacing:-4px}
.ttl .ol{color:transparent;-webkit-text-stroke:3px var(--cy)}
.ttl .gr{background:linear-gradient(90deg,var(--cy),var(--mg));-webkit-background-clip:text;color:transparent}
.tag{position:absolute;left:80px;top:180px;font-family:'JetBrains Mono';font-size:26px;letter-spacing:6px;color:var(--cy)}
/* frosted panel */
.fp{position:absolute;border-radius:34px;background:linear-gradient(170deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.18);box-shadow:0 40px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.chip{display:inline-block;padding:12px 26px;border-radius:14px;font-family:'JetBrains Mono';font-weight:700;font-size:30px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:20px;font-weight:800}
/* captions */
#capbar{position:absolute;left:60px;right:60px;top:1470px;min-height:200px;border-radius:36px;background:rgba(8,12,24,.55);border:1.5px solid rgba(255,255,255,.14);box-shadow:0 30px 70px rgba(0,0,0,.5);padding:34px 44px}
.cap{position:absolute;left:44px;right:44px;top:34px;font-weight:800;font-size:58px;line-height:1.25;letter-spacing:-.5px;opacity:0}
.cap .w{display:inline-block;opacity:.3;margin-right:14px}
.cap .hl{color:#04121a;padding:0 12px;border-radius:12px;background:linear-gradient(90deg,var(--cy),var(--cy2))}
.dot{position:absolute;left:44px;top:-22px;padding:6px 16px;border-radius:10px;background:var(--mg);color:#1a0612;font-family:'JetBrains Mono';font-size:20px;font-weight:700;letter-spacing:2px}
#wipe{position:absolute;inset:-10%;background:linear-gradient(100deg,transparent 40%,rgba(94,234,212,.35) 48%,rgba(255,255,255,.7) 50%,rgba(244,114,182,.35) 52%,transparent 60%);transform:translateX(-120%);pointer-events:none}
svg{overflow:visible}
</style></head>
<body><div id="stage">
 <div id="aur"></div><div class="lines"></div><div class="noise"></div>
 <div id="hud"><div id="brand">CLAUDE <b>✦</b> REEL LAB</div><div id="segs"></div></div>
 <div id="scenes"></div>
 <div id="capbar"><div class="dot">TENGLISH CC</div></div>
 <div id="wipe"></div>
</div>
<script>
const TL=__TIMELINE__;
const HANDLE=new URLSearchParams(location.search).get('h')||'@your_handle';
const E={out:'cubic-bezier(.16,1,.3,1)',back:'cubic-bezier(.34,1.56,.64,1)',io:'cubic-bezier(.65,0,.35,1)'};
const A=(el,kf,st,du,ea=E.out,fill='both',x={})=>el.animate(kf,Object.assign({delay:st*1000,duration:du*1000,fill,easing:ea},x));
const H=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const add=(p,h)=>{const e=H(h);p.appendChild(e);return e};
const slideIn=(el,t,d=.7,dx=120)=>A(el,[{opacity:0,transform:`translateX(${dx}px)`,clipPath:'inset(0 0 0 100%)'},{opacity:1,transform:'none',clipPath:'inset(0 0 0 0%)'}],t,d,E.out);
const rise=(el,t,d=.6,dy=70,base='')=>A(el,[{opacity:0,transform:`${base} translateY(${dy}px)`},{opacity:1,transform:`${base} translateY(0)`}],t,d,E.out);
const scaleIn=(el,t,d=.55,base='')=>A(el,[{opacity:0,transform:`${base} scale(.3)`},{opacity:1,transform:`${base} scale(1)`}],t,d,E.back);
const fadeTo=(el,t,kf,d=.4,ea=E.io)=>A(el,kf,t,d,ea,'forwards');

// aurora background
const aur=document.getElementById('aur');
[['#22d3ee',-200,100,800],['#8b5cf6',500,500,900],['#f472b6',-100,1100,700],['#0ea5e9',600,1400,700]].forEach((b,i)=>{
 const e=add(aur,`<div class="blob" style="background:${b[0]};left:${b[1]}px;top:${b[2]}px;width:${b[3]}px;height:${b[3]}px"></div>`);
 A(e,[{transform:'translate(0,0)'},{transform:`translate(${i%2?-180:200}px,${i<2?160:-140}px)`},{transform:`translate(${i%2?120:-100}px,${i<2?-80:90}px)`},{transform:'translate(0,0)'}],0,TL.total,'ease-in-out','none');});

// scene timings
const lines=TL.lines,sc={},order=[];
lines.forEach(l=>{if(!sc[l.scene]){sc[l.scene]={lines:[]};order.push(l.scene)}sc[l.scene].lines.push(l)});
order.forEach((k,i)=>sc[k].start=i?sc[k].lines[0].start-.4:0);
order.forEach((k,i)=>sc[k].end=i<order.length-1?sc[order[i+1]].start:TL.total);
const S=document.getElementById('scenes');
function mk(k){const s=sc[k];s.el=add(S,`<div class="scene"></div>`);
 A(s.el,[{opacity:0,transform:'translateX(140px)'},{opacity:1,transform:'none'}],s.start,.5,E.out);
 if(k!=='follow')A(s.el,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX(-180px)'}],s.end-.3,.3,E.io,'forwards');
 if(s.start>0)A(document.getElementById('wipe'),[{transform:'translateX(-120%)'},{transform:'translateX(120%)'}],s.start-.15,.6,E.io,'none');
 return s;}
const L=(s,i)=>s.lines[i].start, Le=(s,i)=>s.lines[i].end;
function head(s,tag,html,num){
 if(num){const c=add(s.el,`<div class="chap">${num}</div>`);A(c,[{opacity:0,transform:'translateX(200px)'},{opacity:1,transform:'none'}],s.start+.1,.9,E.out);}
 const t=add(s.el,`<div class="tag">${tag}</div>`);slideIn(t,s.start+.1,.6,40);
 const h=add(s.el,`<div class="ttl">${html}</div>`);slideIn(h,s.start+.2,.8,80);return h;}
const check=(c,sz=40)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const cross=(c,sz=40)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;
function cursor(par,x0,y0){return add(par,`<div class="abs" style="left:${x0}px;top:${y0}px;width:56px;height:56px;z-index:9"><svg width="56" height="56" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" fill="#fff" stroke="#05070d" stroke-width="1.2" stroke-linejoin="round"/></svg></div>`);}
function moveTap(cur,t,dx,dy,d=.7){A(cur,[{opacity:0,transform:'translate(0,0)'},{opacity:1,transform:`translate(${dx}px,${dy}px)`}],t,d,E.out);
 A(cur,[{transform:`translate(${dx}px,${dy}px) scale(1)`},{transform:`translate(${dx}px,${dy}px) scale(.75)`},{transform:`translate(${dx}px,${dy}px) scale(1)`}],t+d,.25,E.io,'forwards');}
function ripple(par,x,y,t,c='#5eead4'){const r=add(par,`<div class="abs" style="left:${x-60}px;top:${y-60}px;width:120px;height:120px;border-radius:50%;border:4px solid ${c};z-index:8"></div>`);A(r,[{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(.4)',offset:.1},{opacity:0,transform:'scale(1.6)'}],t,.6,E.out);}

// HUD segments
const segs=document.getElementById('segs');
['h1','h2','h3','h4','h5','h6','h7'].forEach(k=>{const d=add(segs,'<div><i></i></div>');A(d.firstChild,[{width:'0%'},{width:'100%'}],sc[k].start+.2,.8,E.io,'forwards');});
A(document.getElementById('hud'),[{opacity:0,transform:'translateY(-40px)'},{opacity:1,transform:'none'}],.2,.7);

/* HOOK: terminal prompt -> render */
(()=>{const s=mk('hook');
 const term=add(s.el,`<div class="fp" style="left:80px;top:250px;width:920px;height:420px;padding:36px 40px">
  <div style="display:flex;gap:12px;margin-bottom:34px"><i style="width:20px;height:20px;border-radius:50%;background:#fb7185"></i><i style="width:20px;height:20px;border-radius:50%;background:#fbbf24"></i><i style="width:20px;height:20px;border-radius:50%;background:#4ade80"></i></div>
  <div class="mono" style="font-size:40px;line-height:1.6"><span style="color:var(--cy)">❯</span> <span id="ty"></span><span id="car" style="display:inline-block;width:20px;height:44px;background:var(--cy);vertical-align:middle"></span></div>
  <div class="mono" id="out" style="font-size:28px;color:var(--mu);margin-top:20px;line-height:1.7"></div></div>`);
 rise(term,.2,.7);
 const txt='claude, make my reel';const ty=term.querySelector('#ty');
 [...txt].forEach((ch,i)=>{const e=add(ty,`<span>${ch===' '?'&nbsp;':ch}</span>`);A(e,[{opacity:0},{opacity:1}],.7+i*.06,.01,'linear');});
 A(term.querySelector('#car'),[{opacity:1},{opacity:0},{opacity:1}],0,.8,'steps(2)','none',{iterations:20});
 const out=term.querySelector('#out');
 ['✓ glass widgets','✓ 9:16 · 30fps','✓ telugu voice + captions'].forEach((l,i)=>{const e=add(out,`<div><span style="color:var(--lm)">${l.slice(0,1)}</span>${l.slice(1)}</div>`);rise(e,L(s,1)+.2+i*.35,.4,20);});
 // render bar
 const rb=add(s.el,`<div class="fp" style="left:80px;top:720px;width:920px;height:170px;padding:30px 40px">
  <div class="mono" style="display:flex;justify-content:space-between;font-size:26px;color:#c7d2fe"><span>RENDERING REEL</span><span id="pc">0%</span></div>
  <div style="margin-top:26px;height:22px;border-radius:11px;background:rgba(255,255,255,.1);overflow:hidden"><div id="bar" style="height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--vi),var(--mg))"></div></div></div>`);
 rise(rb,L(s,1),.6);A(rb.querySelector('#bar'),[{width:'0%'},{width:'100%'}],L(s,1)+.3,2.2,E.io,'forwards');
 const pc=rb.querySelector('#pc');[25,50,75,100].forEach((p,i)=>{const e=add(pc.parentNode,`<span class="abs" style="right:40px;top:30px;background:transparent">${p}%</span>`);A(e,[{opacity:0},{opacity:1}],L(s,1)+.3+(i+1)*.55-.05,.01,'linear');if(i<3)A(e,[{opacity:1},{opacity:0}],L(s,1)+.3+(i+2)*.55-.05,.01,'linear','forwards');});
 A(pc,[{opacity:1},{opacity:0}],L(s,1)+.85,.01,'linear','forwards');
 // big reveal
 const big=add(s.el,`<div class="ttl" style="top:960px;font-size:128px">7 SECRET<br><span class="gr">HACKS</span> <span class="ol">↓</span></div>`);
 slideIn(big,L(s,2),.7);
 [term,rb].forEach(e=>fadeTo(e,L(s,2),[{opacity:1,transform:'none'},{opacity:.35,transform:'translateY(-60px) scale(.94)'}],.6));
})();

/* H1 */
(()=>{const s=mk('h1');head(s,'HACK — 01','Video <span class="ol">kaadu</span><br><span class="gr">HTML</span> adugu','01');
 const mp4=add(s.el,`<div class="fp" style="left:80px;top:560px;width:300px;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
  <div class="mono" style="font-size:52px;font-weight:800">.MP4</div><div class="mono" style="font-size:22px;color:var(--mu)">"video cheyyi"</div></div>`);
 rise(mp4,L(s,0)+.2);
 const st=add(mp4,`<div class="abs" style="left:-10px;right:-10px;top:96px;height:8px;border-radius:4px;background:var(--rd);transform-origin:left"></div>`);A(st,[{transform:'scaleX(0) rotate(-14deg)'},{transform:'scaleX(1) rotate(-14deg)'}],L(s,0)+.9,.4,E.io);
 const ed=add(s.el,`<div class="fp" style="left:430px;top:560px;width:570px;height:420px;padding:28px 32px">
   <div class="mono" style="font-size:22px;color:var(--mu);margin-bottom:20px">reel.html</div><div id="cd" class="mono" style="font-size:28px;line-height:1.65"></div></div>`);
 slideIn(ed,L(s,1));
 const code=[['<span style="color:#f472b6">&lt;div</span> <span style="color:#5eead4">class</span>=<span style="color:#bef264">"glass"</span><span style="color:#f472b6">&gt;</span>',0],['<span style="color:#c4b5fd">animate</span>({',1],['  y: <span style="color:#fbbf24">[60, 0]</span>,',1],['  blur: <span style="color:#fbbf24">[12, 0]</span>',1],['})',1],['<span style="color:#f472b6">&lt;/div&gt;</span>',0]];
 const cd=ed.querySelector('#cd');code.forEach(([c,ind],i)=>{const e=add(cd,`<div style="white-space:pre;padding-left:${ind*28}px"><span style="color:#475569;margin-right:18px">${i+1}</span>${c}</div>`);A(e,[{opacity:0,clipPath:'inset(0 100% 0 0)'},{opacity:1,clipPath:'inset(0 0% 0 0)'}],L(s,1)+.4+i*.22,.3,'linear');});
 // frame stack
 const stack=add(s.el,`<div class="abs" style="left:80px;top:1040px;width:920px;height:330px;perspective:1200px"></div>`);
 for(let i=0;i<6;i++){const f=add(stack,`<div class="fp" style="left:${i*120}px;top:${i*10}px;width:300px;height:260px;border-radius:24px;padding:20px;transform:rotateY(-28deg)">
   <div class="mono" style="font-size:20px;color:var(--cy)">frame_${String(i*550+1).padStart(4,'0')}.png</div>
   <div style="margin-top:110px;height:14px;width:${40+i*9}%;border-radius:7px;background:linear-gradient(90deg,var(--cy),var(--mg))"></div></div>`);
  A(f,[{opacity:0,transform:'rotateY(-28deg) translateX(400px)'},{opacity:1,transform:'rotateY(-28deg) translateX(0)'}],L(s,2)+i*.14,.6,E.out);}
 const pl=add(s.el,`<div class="abs" style="left:900px;top:1100px;width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--mg));display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(94,234,212,.6);z-index:5"><svg width="44" height="44" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#05070d"/></svg></div>`);
 scaleIn(pl,L(s,2)+1.1);
})();

/* H2 glass sliders */
(()=>{const s=mk('h2');head(s,'HACK — 02','<span class="gr">Glass</span><br>widgets','02');
 const prev=add(s.el,`<div class="abs" style="left:80px;top:540px;width:920px;height:380px;border-radius:34px;overflow:hidden;background:#0b1020"></div>`);
 rise(prev,L(s,0)+.2);
 [['#22d3ee',120,60,220],['#f472b6',560,150,260],['#bef264',330,220,150]].forEach((b,i)=>{const e=add(prev,`<div class="abs" style="left:${b[1]}px;top:${b[2]}px;width:${b[3]}px;height:${b[3]}px;border-radius:50%;background:${b[0]}"></div>`);
   A(e,[{transform:'translate(0,0)'},{transform:`translate(${i%2?-80:90}px,${i?-30:30}px)`},{transform:'translate(0,0)'}],L(s,0),4,E.io,'none',{iterations:3});});
 const card=add(prev,`<div class="abs" style="left:190px;top:70px;width:540px;height:240px;border-radius:30px;overflow:hidden;background:#1b2133;border:2px solid #1b2133;padding:30px">
   <div class="mono" style="position:relative;z-index:3;font-size:22px;letter-spacing:3px;color:#c7d2fe">WIDGET</div><div style="position:relative;z-index:3;font-weight:900;font-size:58px;margin-top:6px">Frosted ✦</div>
   <div style="position:relative;z-index:3;margin-top:28px;height:12px;width:70%;border-radius:6px;background:rgba(255,255,255,.7)"></div></div>`);
 // inner blurred copy of blobs (faux backdrop blur)
 const inner=add(card,`<div class="abs" style="inset:0;z-index:1;filter:blur(26px) saturate(1.2);opacity:0"></div>`);
 [['#22d3ee',120,60,220],['#f472b6',560,150,260],['#bef264',330,220,150]].forEach((b,i)=>{const e=add(inner,`<div class="abs" style="left:${b[1]-192}px;top:${b[2]-72}px;width:${b[3]}px;height:${b[3]}px;border-radius:50%;background:${b[0]}"></div>`);
   A(e,[{transform:'translate(0,0)'},{transform:`translate(${i%2?-80:90}px,${i?-30:30}px)`},{transform:'translate(0,0)'}],L(s,0),4,E.io,'none',{iterations:3});});
 const sheen=add(card,`<div class="abs" style="inset:0;z-index:2;opacity:0;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.04) 55%,rgba(255,255,255,.1))"></div>`);
 // sliders panel
 const sp=add(s.el,`<div class="fp" style="left:80px;top:960px;width:920px;height:420px;padding:36px 44px"></div>`);slideIn(sp,L(s,1)-.1);
 const t=L(s,1);const sl=[['blur','28px',t+.2,'var(--cy)'],['border','1.5px',t+1.2,'#fff'],['glow','neon',t+2.2,'var(--mg)']];
 sl.forEach(([n,v,tt,c],i)=>{const row=add(sp,`<div style="position:relative;height:110px">
   <div class="mono" style="display:flex;justify-content:space-between;font-size:30px"><span>${n}</span><span style="color:${c}">${v}</span></div>
   <div style="position:relative;margin-top:22px;height:12px;border-radius:6px;background:rgba(255,255,255,.12)"><div class="fl" style="height:100%;width:8%;border-radius:6px;background:${c}"></div>
   <div class="kn" style="position:absolute;top:-14px;left:8%;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;box-shadow:0 0 24px ${c}"></div></div></div>`);
  A(row.querySelector('.fl'),[{width:'8%'},{width:'82%'}],tt,.8,E.io,'forwards');A(row.querySelector('.kn'),[{left:'8%'},{left:'82%'}],tt,.8,E.io,'forwards');});
 A(inner,[{opacity:0},{opacity:.9}],t+.2,.8,E.io,'forwards');A(sheen,[{opacity:0},{opacity:1}],t+.2,.8,E.io,'forwards');
 A(card,[{background:'#1b2133'},{background:'#0e1222'}],t+.2,.8,E.io,'forwards');
 A(card,[{borderColor:'#1b2133'},{borderColor:'rgba(255,255,255,.55)'}],t+1.2,.8,E.io,'forwards');
 A(card,[{boxShadow:'0 0 0 rgba(244,114,182,0)'},{boxShadow:'0 0 70px rgba(244,114,182,.7),0 0 0 2px rgba(244,114,182,.6)'}],t+2.2,.8,E.io,'forwards');
 A(card,[{transform:'translateY(0) rotate(0)'},{transform:'translateY(-14px) rotate(-1.5deg)'},{transform:'translateY(0) rotate(0)'}],L(s,2),2.2,E.io,'none',{iterations:2});
})();

/* H3 drag & drop reference */
(()=>{const s=mk('h3');head(s,'HACK — 03','<span class="gr">Reference</span><br>video ivvu','03');
 const dz=add(s.el,`<div class="abs" style="left:80px;top:560px;width:920px;height:360px;border-radius:34px;border:4px dashed rgba(94,234,212,.5);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <svg width="70" height="70" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="mono" style="font-size:30px;color:var(--cy)">drop reference here</div></div>`);
 rise(dz,L(s,0)+.1);
 const file=add(s.el,`<div class="fp" style="left:700px;top:1250px;width:220px;height:150px;display:flex;align-items:center;justify-content:center;gap:12px;z-index:4"><svg width="46" height="46" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="#f472b6" stroke-width="2"/><path d="M10 9l5 3-5 3z" fill="#f472b6"/></svg><span class="mono" style="font-size:26px">ref.mp4</span></div>`);

 add(pc,`<div class="mono" style="margin-top:30px;font-size:46px;font-weight:700">${HANDLE}</div>`);
 add(pc,`<div style="margin-top:12px;font-size:30px;color:var(--mu)">Claude · AI · Video hacks in Telugu</div>`);
 const stats=add(pc,`<div style="display:flex;gap:80px;margin-top:40px;text-align:center"><div><div style="font-weight:900;font-size:48px">7</div><div style="font-size:24px;color:var(--mu)">hacks</div></div><div><div id="fc" style="position:relative;font-weight:900;font-size:48px;width:180px;height:58px"></div><div style="font-size:24px;color:var(--mu)">followers</div></div><div><div style="font-weight:900;font-size:48px">1</div><div style="font-size:24px;color:var(--mu)">secret</div></div></div>`);

 const cur=cursor(s.el,860,1500);moveTap(cur,tap-.7,-260,-290,.7);ripple(s.el,580,1245,tap);
 A(btn,[{background:'linear-gradient(90deg,#5eead4,#22d3ee)'},{background:'linear-gradient(90deg,#111827,#1e293b)'}],tap+.05,.3,E.io,'forwards');
 A(btn.querySelector('.a'),[{opacity:1},{opacity:0}],tap,.15,E.io,'forwards');A(btn.querySelector('.b'),[{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'scale(1)'}],tap+.1,.4,E.back);
 const bye=add(s.el,`<div class="abs mono" style="left:0;width:1080px;text-align:center;top:1385px;font-size:28px;color:var(--mu)">see you in the next reel ✦</div>`);rise(bye,tap+.6,.5,20);
})();

/* CAPTIONS: karaoke */
const CB=document.getElementById('capbar');
A(CB,[{opacity:0,transform:'translateY(60px)'},{opacity:1,transform:'none'}],.4,.6);
lines.forEach((l,idx)=>{
 const ws=l.cap.replace(/\*([^*]+)\*/g,(m,g)=>g.split(' ').map(w=>'§'+w).join(' ')).split(' ');
 const el=add(CB,`<div class="cap"></div>`);
 const dur=(l.end-l.start)*.92;
 ws.forEach((w,i)=>{const hl=w.startsWith('§');const e=add(el,`<span class="w${hl?' hl':''}">${w.replace('§','')}</span>`);
  const t=l.start+dur*i/ws.length;A(e,[{opacity:.3},{opacity:1}],t,.12,'linear');
  if(hl)A(e,[{transform:'translateY(0)'},{transform:'translateY(-8px)'},{transform:'translateY(0)'}],t,.3,E.out,'forwards');});
 const nxt=idx<lines.length-1?lines[idx+1].start:TL.total;
 A(el,[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],l.start-.15,.18,E.out);
 A(el,[{opacity:1},{opacity:0,transform:'translateY(-20px)'}],Math.min(nxt-.15,l.end+.7),.15,'linear','forwards');
});
window.seek=t=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000});
seek(0);window.READY=true;
