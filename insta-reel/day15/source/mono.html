<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root{--rd:#ff2d2d;--wh:#f5f5f5;--gr:#8a8a8a;--dk:#0a0a0a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--dk);font-family:'Inter',sans-serif;color:var(--wh)}
#stage{position:absolute;inset:0;overflow:hidden}
.bgglow{position:absolute;left:50%;top:38%;width:1400px;height:1400px;margin:-700px 0 0 -700px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07),transparent 60%)}
.redglow{position:absolute;left:-300px;top:1300px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(255,45,45,.14),transparent 62%)}
.grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:120px 120px}
.grain{position:absolute;inset:-50%;opacity:.07;background-image:radial-gradient(#fff 1px,transparent 1.2px);background-size:5px 5px}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.75));pointer-events:none}
.scene{position:absolute;inset:0;opacity:0;perspective:1800px}
.abs{position:absolute}
.mono{font-family:'JetBrains Mono',monospace}
#hud{position:absolute;top:70px;left:70px;right:70px;display:flex;justify-content:space-between;align-items:center}
#brand{font-family:'JetBrains Mono';font-size:26px;letter-spacing:5px;color:#cfcfcf}
#day{padding:10px 24px;border-radius:10px;background:var(--rd);font-family:'Inter Display';font-weight:900;font-size:34px;letter-spacing:1px;color:#fff;box-shadow:0 0 40px rgba(255,45,45,.45)}
.kick{position:absolute;left:80px;top:185px;font-family:'JetBrains Mono';font-size:26px;letter-spacing:6px;color:var(--rd)}
.ttl{position:absolute;left:80px;top:230px;width:940px;font-family:'Inter Display';font-weight:900;font-size:104px;line-height:.95;letter-spacing:-4px}
.ttl .r{color:var(--rd)} .ttl .o{color:transparent;-webkit-text-stroke:2.5px var(--wh)}
.card{position:absolute;border-radius:30px;background:linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.2);box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25)}
.card.red{border-color:var(--rd);box-shadow:0 0 50px rgba(255,45,45,.35),0 40px 80px rgba(0,0,0,.6)}
.flip{position:absolute;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px}
.back{opacity:0}
.lbl{font-family:'JetBrains Mono';font-size:22px;letter-spacing:4px;color:var(--gr)}
.chip{display:inline-flex;align-items:center;padding:14px 24px;border-radius:14px;font-family:'JetBrains Mono';font-weight:700;font-size:28px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.25)}
.stamp{position:absolute;padding:14px 34px;border:6px solid var(--rd);border-radius:16px;color:var(--rd);font-family:'Inter Display';font-weight:900;font-size:88px;letter-spacing:4px}
#phone{position:absolute;left:630px;top:470px;width:380px;height:660px;border-radius:44px;background:#000;border:10px solid #1d1d1d;box-shadow:0 0 0 2px rgba(255,255,255,.12),0 40px 100px rgba(0,0,0,.8);opacity:0;transform-style:preserve-3d}
#phone .scr{position:absolute;inset:0;border-radius:34px;overflow:hidden;background:#000}
#capbar{position:absolute;left:60px;right:60px;top:1470px;min-height:200px;border-radius:30px;background:rgba(18,18,18,.82);border:1.5px solid rgba(255,255,255,.14);padding:34px 44px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
#capbar .tag{position:absolute;left:44px;top:-20px;padding:6px 16px;border-radius:8px;background:var(--wh);color:#000;font-family:'JetBrains Mono';font-size:20px;font-weight:800;letter-spacing:2px}
.cap{position:absolute;left:44px;right:44px;top:34px;font-weight:800;font-size:56px;line-height:1.26;letter-spacing:-.5px;opacity:0}
.cap .w{display:inline-block;opacity:.28;margin-right:13px}
.cap .hl{color:#fff;padding:0 12px;border-radius:10px;background:var(--rd)}
#wipe{position:absolute;inset:0;background:linear-gradient(90deg,transparent 42%,rgba(255,255,255,.9) 49.5%,rgba(255,45,45,.9) 50.5%,transparent 58%);transform:translateX(-110%);pointer-events:none;mix-blend-mode:screen}
svg{overflow:visible}
</style></head>
<body><div id="stage">
<div class="bgglow"></div><div class="redglow" id="rg"></div><div class="grid"></div><div class="grain" id="grain"></div>
<div id="hud"><div id="brand">DEV INVENTOR ✦ CLAUDE</div><div id="day">DAY 15</div></div>
<div id="scenes"></div>
<div id="phone"><div class="scr" id="scr"></div></div>
<div id="capbar"><div class="tag">TENGLISH CC</div></div>
<div class="vig"></div><div id="wipe"></div>
</div>
<script>
const TL=__TIMELINE__;
const NAME='Dev Inventor';
const E={out:'cubic-bezier(.16,1,.3,1)',back:'cubic-bezier(.34,1.56,.64,1)',io:'cubic-bezier(.65,0,.35,1)'};
const A=(el,kf,st,du,ea=E.out,fill='both',x={})=>el.animate(kf,Object.assign({delay:st*1000,duration:du*1000,fill,easing:ea},x));
const H=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const add=(p,h)=>{const e=H(h);p.appendChild(e);return e};
const fadeTo=(el,t,kf,d=.4)=>A(el,kf,t,d,E.io,'forwards');
// 3D flip-in from edge
const flipIn=(el,t,d=.8,axis='Y',from=-100)=>A(el,[{opacity:0,transform:`rotate${axis}(${from}deg) translateZ(-200px)`},{opacity:1,transform:'rotateY(0) translateZ(0)'}],t,d,E.out);
const flipOut=(el,t,d=.5,axis='Y',to=100)=>A(el,[{opacity:1,transform:'rotateY(0)'},{opacity:0,transform:`rotate${axis}(${to}deg) translateZ(-200px)`}],t,d,E.io,'forwards');
const flipTurn=(el,t,d=.8)=>A(el,[{transform:'rotateY(0)'},{transform:'rotateY(180deg)'}],t,d,E.io,'forwards');
function turn(f,t,d=.8){const fr=f.children[0],bk=f.children[1];
 A(fr,[{transform:'perspective(1400px) rotateY(0)',opacity:1},{transform:'perspective(1400px) rotateY(90deg)',opacity:1}],t,d/2,'cubic-bezier(.55,0,1,.45)','forwards');
 A(fr,[{opacity:1},{opacity:0}],t+d/2,.01,'linear','forwards');
 A(bk,[{transform:'perspective(1400px) rotateY(-90deg)',opacity:1},{transform:'perspective(1400px) rotateY(0)',opacity:1}],t+d/2,d/2,'cubic-bezier(0,.55,.45,1)','both');
 A(bk,[{opacity:0},{opacity:1}],t+d/2,.01,'linear','both');}
const pop=(el,t,d=.5,base='')=>A(el,[{opacity:0,transform:`${base} scale(.3)`},{opacity:1,transform:`${base} scale(1)`}],t,d,E.back);
const rise=(el,t,d=.55,dy=50,base='')=>A(el,[{opacity:0,transform:`${base} translateY(${dy}px)`},{opacity:1,transform:`${base} translateY(0)`}],t,d,E.out);
const check=(c,sz=40)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const cross=(c,sz=40)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;
const mic=(c,sz=60)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="${c}"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`;
const lock=(c,sz=80)=>`<svg width="${sz}" height="${sz*1.13}" viewBox="0 0 30 34"><path d="M8 15V10a7 7 0 0 1 14 0v5" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/><rect x="4" y="15" width="22" height="17" rx="4" fill="${c}"/><circle cx="15" cy="23.5" r="2.5" fill="#0a0a0a"/></svg>`;
function cursor(par,x,y){return add(par,`<div class="abs" style="left:${x}px;top:${y}px;width:54px;height:54px;z-index:9"><svg width="54" height="54" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg></div>`);}

// timings
const lines=TL.lines,sc={},order=[];
lines.forEach(l=>{if(!sc[l.scene]){sc[l.scene]={lines:[]};order.push(l.scene)}sc[l.scene].lines.push(l)});
order.forEach((k,i)=>sc[k].start=i?sc[k].lines[0].start-.4:0);
order.forEach((k,i)=>sc[k].end=i<order.length-1?sc[order[i+1]].start:TL.total);
const L=(s,i)=>s.lines[i].start, Le=(s,i)=>s.lines[i].end;
const S=document.getElementById('scenes');
function mk(k){const s=sc[k];s.el=add(S,`<div class="scene"></div>`);
 A(s.el,[{opacity:0},{opacity:1}],s.start,.3,E.io);
 if(k!=='follow')A(s.el,[{opacity:1,transform:'none'},{opacity:0,transform:'rotateY(-25deg) translateX(-120px)'}],s.end-.3,.3,E.io,'forwards');
 if(s.start>0)A(document.getElementById('wipe'),[{transform:'translateX(-110%)'},{transform:'translateX(110%)'}],s.start-.12,.5,E.io,'none');
 return s;}
function head(s,kick,html){const k=add(s.el,`<div class="kick">${kick}</div>`);A(k,[{opacity:0,letterSpacing:'20px'},{opacity:1,letterSpacing:'6px'}],s.start+.05,.6);
 const t=add(s.el,`<div class="ttl">${html}</div>`);A(t,[{opacity:0,transform:'rotateX(-80deg)',transformOrigin:'50% 100%'},{opacity:1,transform:'rotateX(0)',transformOrigin:'50% 100%'}],s.start+.12,.7,E.out);return t;}
// background motion
A(document.getElementById('grain'),[{transform:'translate(0,0)'},{transform:'translate(-20px,15px)'},{transform:'translate(10px,-10px)'},{transform:'translate(0,0)'}],0,.4,'steps(4)','none',{iterations:Math.ceil(TL.total/.4)});
A(document.getElementById('rg'),[{transform:'translate(0,0)'},{transform:'translate(500px,-500px)'},{transform:'translate(200px,-1100px)'},{transform:'translate(0,0)'}],0,TL.total,'ease-in-out','none');
A(document.getElementById('hud'),[{opacity:0,transform:'translateY(-40px)'},{opacity:1,transform:'none'}],.1,.6);
A(document.getElementById('day'),[{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],.6,.5,E.back);

/* PHONE (global): yesterday's reel -> proof recording (overlaid in post) */
const ph=document.getElementById('phone'),scr=document.getElementById('scr');
const thumb=add(scr,`<img src="assets/v3_hook.jpg" style="width:100%;height:100%;object-fit:cover">`);
add(scr,`<div class="abs mono" style="left:0;right:0;bottom:24px;text-align:center;font-size:20px;color:#fff;text-shadow:0 2px 8px #000">yesterday's reel</div>`);
const pStart=sc.hook.start+.4, pFlip=L(sc.proof,0)-.05, pEnd=sc.tease.start-.35;
A(ph,[{opacity:0,transform:'rotateY(-70deg) translateX(200px)'},{opacity:1,transform:'rotateY(-8deg) translateX(0)'}],pStart,.9,E.out);
A(ph,[{transform:'rotateY(-8deg)'},{transform:'rotateY(-8deg) rotateX(0) scaleX(0)'},{transform:'rotateY(0) scaleX(1)'}],pFlip,.5,E.io,'forwards');
A(thumb,[{opacity:1},{opacity:0}],pFlip+.25,.01,'linear','forwards');
A(ph,[{opacity:1,transform:'rotateY(0) scaleX(1)'},{opacity:0,transform:'rotateY(70deg) translateX(300px)'}],pEnd,.4,E.io,'forwards');
window.PROOF={x:640,y:480,w:360,h:640,start:pFlip+.3,end:pEnd};

/* HOOK */
(()=>{const s=mk('hook');head(s,'BEHIND THE SCENES','Ela<br><span class="r">chesav?</span>');
 const cm=[['bro ela chesav?? 🤯'.replace(' 🤯',''),90,520],['tutorial please','140','680'],['prompt kavali!',80,840],['edit cheyyaleda nijamga?',120,1000]];
 cm.forEach(([t,x,y],i)=>{const e=add(s.el,`<div class="card" style="left:${x}px;top:${y}px;padding:20px 28px;border-radius:24px 24px 24px 6px;font-size:32px;font-weight:700;display:flex;gap:14px;align-items:center"><span style="width:44px;height:44px;border-radius:50%;background:${['#fff','#555','#ff2d2d','#999'][i]}"></span>${t}</div>`);
  A(e,[{opacity:0,transform:'rotateX(90deg) translateY(40px)'},{opacity:1,transform:'rotateX(0) translateY(0)'}],L(s,0)+.5+i*.4,.5,E.back);});
})();

/* PROOF */
(()=>{const s=mk('proof');
 const st=add(s.el,`<div class="stamp" style="left:90px;top:640px;transform:rotate(-10deg)">PROOF</div>`);
 A(st,[{opacity:0,transform:'rotate(-10deg) scale(3)'},{opacity:1,transform:'rotate(-10deg) scale(1)'}],L(s,0)+.1,.35,E.back);
 const ar=add(s.el,`<div class="abs mono" style="left:110px;top:860px;font-size:30px;color:var(--gr)">real screen<br>recording →<br><span style="color:var(--rd)">2x speed</span></div>`);rise(ar,L(s,0)+.4,.5);
 add(s.el,`<div class="kick" style="top:185px">RAW · UNEDITED</div>`);
 const t=add(s.el,`<div class="ttl">Idigo<br><span class="o">proof</span></div>`);A(t,[{opacity:0,transform:'scale(1.4)'},{opacity:1,transform:'scale(1)'}],s.start+.1,.5,E.out);
})();

/* STEP card helper: big flipping number card on the left column */
function stepCard(s,n){const c=add(s.el,`<div class="card red" style="left:80px;top:500px;width:200px;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="lbl" style="color:var(--rd)">STEP</div><div style="font-family:'Inter Display';font-weight:900;font-size:110px;line-height:1">${n}</div></div>`);
 A(c,[{opacity:0,transform:'rotateY(-180deg)'},{opacity:1,transform:'rotateY(0)'}],s.start+.15,.9,E.out);return c;}

/* S1 */
(()=>{const s=mk('s1');head(s,'STEP 01','Okka<br><span class="r">prompt</span>');stepCard(s,'01');
 const pr=add(s.el,`<div class="card" style="left:80px;top:740px;width:520px;height:250px;padding:26px 28px"><div class="lbl">PROMPT</div><div class="mono ty" style="margin-top:16px;font-size:28px;line-height:1.5"></div></div>`);
 A(pr,[{opacity:0,transform:'rotateX(-90deg)'},{opacity:1,transform:'rotateX(0)'}],L(s,0)+.3,.6,E.out);
 const txt='Ee reference laaga reel cheyyi. Telugu voice, Tenglish captions…';const ty=pr.querySelector('.ty');
 [...txt].forEach((ch,i)=>{const e=add(ty,`<span>${ch===' '?'&nbsp;':ch}</span>`);A(e,[{opacity:0},{opacity:1}],L(s,0)+.8+i*.035,.01,'linear');});
 ['Reference video','Telugu voice','Tenglish captions'].forEach((c,i)=>{const e=add(s.el,`<div class="chip" style="position:absolute;left:80px;top:${1020+i*95}px;width:520px;justify-content:space-between">${c}<span>${check('#ff2d2d',34)}</span></div>`);
  A(e,[{opacity:0,transform:'rotateY(90deg)'},{opacity:1,transform:'rotateY(0)'}],L(s,1)+i*.45,.55,E.back);});
})();

/* S2 */
(()=>{const s=mk('s2');head(s,'STEP 02','Mundu<br><span class="r">MCQs</span>');stepCard(s,'02');
 const sp=add(s.el,`<div class="card" style="left:310px;top:500px;width:290px;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px"><div class="ring" style="width:70px;height:70px;border-radius:50%;border:7px solid rgba(255,255,255,.15);border-top-color:#fff"></div><div class="mono st" style="font-size:22px;color:var(--gr)">starting…</div></div>`);
 rise(sp,L(s,0)+.2);A(sp.querySelector('.ring'),[{transform:'rotate(0)'},{transform:'rotate(1080deg)'}],L(s,0)+.2,1.6,'linear','forwards');
 A(sp.querySelector('.ring'),[{borderTopColor:'#fff',borderColor:'rgba(255,255,255,.15)'},{borderColor:'#ff2d2d',borderTopColor:'#ff2d2d'}],L(s,0)+1.6,.3,E.io,'forwards');
 const pa=add(sp,`<div class="mono" style="position:absolute;bottom:22px;font-size:22px;color:var(--rd);opacity:0">PAUSED ✋</div>`);A(pa,[{opacity:0},{opacity:1}],L(s,0)+1.6,.2,E.io,'forwards');A(sp.querySelector('.st'),[{opacity:1},{opacity:0}],L(s,0)+1.6,.2,E.io,'forwards');
 const qs=[['Topic?','Claude video hacks'],['Voice?','Telugu'],['Length?','90 sec']];
 qs.forEach(([q,a],i)=>{const f=add(s.el,`<div class="flip" style="left:${80+i*16}px;top:${740+i*16}px;width:520px;height:220px;z-index:${3-i}">
   <div class="face card" style="padding:28px"><div class="lbl">CLAUDE ASKS · Q${i+1}</div><div style="font-weight:900;font-size:56px;margin-top:20px">${q}</div></div>
   <div class="face back card red" style="padding:28px;display:flex;flex-direction:column;justify-content:center"><div class="lbl" style="color:var(--rd)">MY ANSWER</div><div style="display:flex;align-items:center;gap:16px;font-weight:900;font-size:50px;margin-top:14px">${check('#ff2d2d',50)}${a}</div></div></div>`);
  const t0=L(s,1)+.1;A(f,[{opacity:0,transform:'translateY(200px) rotateX(40deg)'},{opacity:1,transform:'none'}],t0+i*.12,.5,E.out);
  const ft=L(s,1)+.7+i*.75;turn(f,ft,.55);
  if(i<2)A(f,[{transform:'translateY(0)',opacity:1},{transform:'translateX(560px) rotate(-12deg)',opacity:0}],ft+.6,.4,E.io,'forwards');});
})();

/* S3 */
(()=>{const s=mk('s3');head(s,'STEP 03','Copy <span class="o">kaadu</span><br><span class="r">own</span> design');stepCard(s,'03');
 const f=add(s.el,`<div class="flip" style="left:310px;top:500px;width:290px;height:500px">
   <div class="face card" style="overflow:hidden"><img src="assets/v1.jpg" style="width:100%;height:100%;object-fit:cover;opacity:.85"><div class="abs mono" style="left:0;right:0;bottom:0;padding:14px;background:rgba(0,0,0,.7);font-size:22px;text-align:center">v1 · copy laaga</div></div>
   <div class="face back card red" style="overflow:hidden"><img src="assets/v3_glass.jpg" style="width:100%;height:100%;object-fit:cover"><div class="abs mono" style="left:0;right:0;bottom:0;padding:14px;background:rgba(0,0,0,.7);font-size:22px;text-align:center;color:#fff">v3 · own design ✓</div></div></div>`);
 A(f,[{opacity:0,transform:'rotateY(-90deg)'},{opacity:1,transform:'rotateY(0)'}],L(s,0)+.2,.7,E.out);
 const x=add(s.el,`<div class="abs" style="left:540px;top:470px;width:90px;height:90px;border-radius:50%;background:var(--rd);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(255,45,45,.7);z-index:5">${cross('#fff',50)}</div>`);
 pop(x,L(s,1)+.5);fadeTo(x,L(s,2),[{opacity:1},{opacity:0,transform:'scale(.3)'}],.3);
 const bub=add(s.el,`<div class="card" style="left:80px;top:1040px;width:520px;padding:24px 30px;border-radius:28px 28px 6px 28px;font-size:38px;font-weight:800;line-height:1.3">"Copy cheyyaku,<br>own ga cheyyi" <span style="color:var(--rd)">✋</span></div>`);
 A(bub,[{opacity:0,transform:'rotateX(90deg)'},{opacity:1,transform:'rotateX(0)'}],L(s,1),.5,E.back);
 turn(f,L(s,2)+.1,.9);
 const nw=add(s.el,`<div class="chip" style="position:absolute;left:310px;top:1260px;background:var(--rd);border-color:var(--rd);color:#fff">NEW DESIGN ✓</div>`);pop(nw,L(s,2)+.9);
 fadeTo(bub,L(s,2)+.6,[{opacity:1},{opacity:.35}],.4);
})();

/* S4 */
(()=>{const s=mk('s4');head(s,'STEP 04','Naa <span class="r">voice</span><br><span class="o">best</span>');stepCard(s,'04');
 const f=add(s.el,`<div class="flip" style="left:310px;top:500px;width:290px;height:200px">
   <div class="face card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px"><div class="lbl">SUGGESTED</div><div style="font-weight:900;font-size:46px">AI voice</div></div>
   <div class="face back card red" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">${mic('#ff2d2d',64)}<div style="font-weight:900;font-size:40px">MY VOICE</div></div></div>`);
 A(f,[{opacity:0,transform:'rotateY(-90deg)'},{opacity:1,transform:'rotateY(0)'}],L(s,0)+.3,.6,E.out);
 const ai=f.firstElementChild;const sx=add(ai,`<div class="abs" style="right:-14px;top:-14px;width:56px;height:56px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;opacity:0">${cross('#fff',30)}</div>`);
 A(sx,[{opacity:0,transform:'scale(0)'},{opacity:1,transform:'scale(1)'}],L(s,1)-.1,.3,E.back);
 turn(f,L(s,1)+.35,.8);
 const lv=add(s.el,`<div class="abs mono" style="left:480px;top:478px;padding:6px 14px;border-radius:8px;background:var(--rd);color:#fff;font-size:20px;font-weight:800;z-index:4">● LIVE</div>`);pop(lv,L(s,1)+1.1,.4);
 A(lv,[{opacity:1},{opacity:.35},{opacity:1}],L(s,1)+1.5,1,'ease-in-out','none',{iterations:8});
 // waveform with gaps that close
 const wv=add(s.el,`<div class="card" style="left:80px;top:740px;width:520px;height:380px;padding:26px 24px"><div class="lbl">MY RECORDING</div><div class="row" style="position:relative;margin-top:30px;height:230px"></div></div>`);
 A(wv,[{opacity:0,transform:'rotateX(-90deg)'},{opacity:1,transform:'rotateX(0)'}],L(s,2)-.2,.6,E.out);
 const row=wv.querySelector('.row');const groups=[[0,9],[9,17],[17,26]];const gapW=70,bw=10,bg=5;let x=0;const gx=[];
