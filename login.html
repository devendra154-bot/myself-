<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DevInventor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <nav class="container nav">
    <a href="index.html" class="logo">Dev<span>Inventor</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="request.html">Start a Project</a></li>
    </ul>
    <button id="navToggle" aria-label="Menu">☰</button>
  </nav>
</header>

<div class="container auth-wrap">
  <div class="panel">
    <div class="tabs">
      <button id="tabLogin" class="active" type="button">Login</button>
      <button id="tabSignup" type="button">Sign up</button>
    </div>
    <div id="msg" class="msg"></div>

    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-block" type="submit">Login</button>
    </form>

    <form id="signupForm" hidden>
      <div class="field"><label>Full name</label><input name="name" required autocomplete="name"></div>
      <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"></div>
      <div class="field"><label>Mobile (WhatsApp)</label><input type="tel" name="phone" required pattern="[0-9+ ]{10,15}" placeholder="98xxxxxxxx"></div>
      <div class="field"><label>Password (min 6 chars)</label><input type="password" name="password" required minlength="6" autocomplete="new-password"></div>
      <button class="btn btn-block" type="submit">Create Account</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  const next = new URLSearchParams(location.search).get("next");
  const target = next && /^[\w-]+\.html$/.test(next) ? next : "request.html";
  if (Auth.current()) location.href = target;

  const msg = document.getElementById("msg");
  const lf = document.getElementById("loginForm"), sf = document.getElementById("signupForm");
  const tl = document.getElementById("tabLogin"), ts = document.getElementById("tabSignup");
  function show(signup) {
    sf.hidden = !signup; lf.hidden = signup;
    ts.classList.toggle("active", signup); tl.classList.toggle("active", !signup);
    msg.className = "msg";
  }
  tl.onclick = () => show(false); ts.onclick = () => show(true);
  if (location.hash === "#signup") show(true);

  async function handle(e, fn) {
    e.preventDefault();
    try { await fn(Object.fromEntries(new FormData(e.target))); location.href = target; }
    catch (err) { msg.textContent = err.message; msg.className = "msg err"; }
  }
  lf.onsubmit = e => handle(e, Auth.login);
  sf.onsubmit = e => handle(e, Auth.signup);
</script>
</body>
</html>
